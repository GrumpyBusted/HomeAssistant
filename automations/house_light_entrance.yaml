- id: house_light_entrance
  alias: Hus lys entre
  description: |
    Styrer belysningen ved hoveddøren.
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.house_presence_entrance
      from: "off"
      to: "on"
      id: detected_entrance

    - trigger: state
      entity_id: binary_sensor.house_presence_entrance
      from: "on"
      to: "off"
      id: cleared_entrance

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: detected_entrance
            - condition: state
              entity_id: light.house_decoration
              state: "on"
          sequence:
            - action: light.turn_on
              data:
                brightness_pct: 20
                transition: 1
                color_temp_kelvin: 2300
              target:
                entity_id:
                  - light.house_light_entrance_spot_1
                  - light.house_light_entrance_spot_2
                  - light.house_light_entrance_spot_3

        - conditions:
            - condition: trigger
              id: detected_entrance
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              data:
                brightness_pct: 70
                transition: 1
                color_temp_kelvin: 2700
              target:
                entity_id:
                  - light.house_light_entrance_spot_1
                  - light.house_light_entrance_spot_2
                  - light.house_light_entrance_spot_3

        - conditions:
            - condition: trigger
              id: cleared_entrance
          sequence:
            - action: light.turn_off
              data:
                transition: 1
              target:
                entity_id:
                  - light.house_light_entrance_spot_1
                  - light.house_light_entrance_spot_2
                  - light.house_light_entrance_spot_3
