- id: BE2E2F67-1BD7-4C0B-9325-7799F95EB16C
  alias: Hjem varmepumpe
  description: |
    Styring af central varmepumpe, tænder og slukker og juseret offset og effektivitet.
  mode: queued
  max: 10
  trace:
    stored_traces: 100

  triggers:
    - trigger: state
      entity_id: binary_sensor.home_heat_pump_operation

    - trigger: state
      entity_id: sensor.home_heat_pump_offset

    - trigger: time_pattern
      minutes: "/5"
      id: fallback

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: climate.home_heat_pump
                  state: "off"
            - condition: state
              entity_id: binary_sensor.home_heat_pump_operation
              state: "off"
          sequence:
            - action: climate.turn_off
              target:
                entity_id: climate.home_heat_pump
        - conditions:
            - condition: state
              entity_id: climate.home_heat_pump
              state: "off"
            - condition: state
              entity_id: binary_sensor.home_heat_pump_operation
              state: "on"
          sequence:
            - action: climate.turn_on
              target:
                entity_id: climate.home_heat_pump
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.home_heat_pump
              data:
                hvac_mode: heat
            - wait_template: "{{ not is_state('climate.home_heat_pump', 'off') }}"
              timeout: "00:00:05"
              continue_on_timeout: true
            - wait_template: "{{ state_attr('climate.home_heat_pump', 'min_temp') < 0 }}"
              timeout: "00:00:15"
              continue_on_timeout: true

    - if:
        - condition: state
          entity_id: binary_sensor.home_heat_pump_operation
          state: "on"
        - condition: not
          conditions:
            - condition: state
              entity_id: climate.home_heat_pump
              state: "off"
      then:
        - action: climate.set_temperature
          target:
            entity_id: climate.home_heat_pump
          data:
            temperature: |-
              {{ states('sensor.home_heat_pump_offset') | float(0) }}
          continue_on_error: true

    - choose:
        - conditions:
            - condition: state
              entity_id: climate.home_heat_pump
              state: "off"
          sequence: []
        - conditions:
            - condition: numeric_state
              entity_id: sensor.home_heat_pump_offset
              above: 3
          sequence:
            - action: climate.set_preset_mode
              target:
                entity_id: climate.home_heat_pump
              data:
                preset_mode: comfort
        - conditions:
            - condition: numeric_state
              entity_id: sensor.home_heat_pump_offset
              above: 1
          sequence:
            - action: climate.set_preset_mode
              target:
                entity_id: climate.home_heat_pump
              data:
                preset_mode: none
      default:
        - action: climate.set_preset_mode
          data:
            preset_mode: eco
          target:
            entity_id: climate.home_heat_pump
