- id: BE2E2F67-1BD7-4C0B-9325-7799F95EB16C
  alias: Hjem varmepumpe
  description: |
    Styring af central varmepumpe, tænder og slukker og juseret offset og effektivitet.
  mode: queued
  max: 10
  trace:
    stored_traces: 100

  triggers:
    - trigger: state
      entity_id: binary_sensor.home_heat_pump_operation

    - trigger: state
      entity_id: sensor.home_heat_pump_offset

    - trigger: state
      entity_id: climate.home_heat_pump
      id: heat_pump_changed

    - trigger: state
      entity_id: timer.home_heat_pump_manual_timer
      to: idle

    - trigger: homeassistant
      event: start

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: heat_pump_changed
            - condition: template
              value_template: |-
                {{ is_state('climate.home_heat_pump', 'off') == is_state('binary_sensor.home_heat_pump_operation', 'off') }}
            - condition: state
              entity_id: timer.home_heat_pump_manual_timer
              state: active
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.home_heat_pump_manual_timer

        - conditions:
            - condition: trigger
              id: heat_pump_changed
            - condition: template
              value_template: |-
                {{ is_state('climate.home_heat_pump', 'off') != is_state('binary_sensor.home_heat_pump_operation', 'off') }}
            - condition: state
              entity_id: timer.home_heat_pump_manual_timer
              state: idle
          sequence:
            - action: timer.start
              target:
                entity_id: timer.home_heat_pump_manual_timer
              data:
                duration: "06:00:00"

        - conditions:
            - condition: trigger
              id: heat_pump_changed
          sequence: []

        - conditions:
            - condition: state
              entity_id: timer.home_heat_pump_manual_timer
              state: active
          sequence: []

        - conditions:
            - condition: state
              entity_id: binary_sensor.home_heat_pump_operation
              state: "off"
            - condition: template
              value_template: |-
                {{ is_state('climate.home_heat_pump', 'off') != is_state('binary_sensor.home_heat_pump_operation', 'off') }}
          sequence:
            - action: climate.turn_off
              target:
                entity_id: climate.home_heat_pump

        - conditions:
            - condition: state
              entity_id: binary_sensor.home_heat_pump_operation
              state: "on"
            - condition: template
              value_template: |-
                {{ is_state('climate.home_heat_pump', 'off') != is_state('binary_sensor.home_heat_pump_operation', 'off') }}
          sequence:
            - action: climate.turn_on
              target:
                entity_id: climate.home_heat_pump
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.home_heat_pump
              data:
                hvac_mode: heat

    - if:
        - condition: state
          entity_id: timer.home_heat_pump_manual_timer
          state: idle
        - condition: not
          conditions:
            - condition: state
              entity_id: climate.home_heat_pump
              state: "off"
      then:
        - wait_template: |-
            {% set offset = states('sensor.home_heat_pump_offset') | float(0) %} 
            {% set min_temp = state_attr('climate.home_heat_pump', 'min_temp') | float(5) %} 
            {% set max_temp = state_attr('climate.home_heat_pump', 'max_temp') | float(65) %} 
            {{ min_temp <= offset <= max_temp }}
          timeout: "00:02:00"

        - action: climate.set_temperature
          target:
            entity_id: climate.home_heat_pump
          data:
            temperature: |-
              {{ states('sensor.home_heat_pump_offset') | float(0) }}

        - choose:
            - conditions:
                - condition: numeric_state
                  entity_id: sensor.home_heat_pump_offset
                  above: 3
              sequence:
                - action: climate.set_preset_mode
                  target:
                    entity_id: climate.home_heat_pump
                  data:
                    preset_mode: comfort
            - conditions:
                - condition: numeric_state
                  entity_id: sensor.home_heat_pump_offset
                  above: 1
              sequence:
                - action: climate.set_preset_mode
                  target:
                    entity_id: climate.home_heat_pump
                  data:
                    preset_mode: none
          default:
            - action: climate.set_preset_mode
              data:
                preset_mode: eco
              target:
                entity_id: climate.home_heat_pump
