- id: BE2E2F67-1BD7-4C0B-9325-7799F95EB16C
  alias: Hjem varmepumpe
  description: |
    Styring af central varmepumpe, tænder og slukker og juseret offset og effektivitet.
  mode: queued
  max: 10
  trace:
    stored_traces: 100

  triggers:
    - trigger: state
      entity_id: sensor.home_heat_pump_operation
      id: operation_changed

    - trigger: template
      value_template: >
        {{ states('sensor.home_heat_need') | float(0) > 0 }}

  conditions: []

  actions:

    - variables:
        operation: "{{ states('sensor.home_heat_pump_operation') }}"
        heat_need: "{{ states('sensor.home_heat_need') | float(0) }}"

        offset: >
          {% if heat_need < 0 %}
            0
          {% elif heat_need <= 0.2 %}
            0
          {% elif heat_need <= 0.5 %}
            1
          {% elif heat_need <= 0.8 %}
            2
          {% elif heat_need <= 1.1 %}
            3
          {% elif heat_need <= 1.5 %}
            4
          {% else %}
            5
          {% endif %}

    - choose:
        - conditions:
            - condition: state
              entity_id: sensor.home_heat_pump_operation
              state: "off"
          sequence:
            - action: climate.turn_off
              target:
                entity_id: climate.central_heat_pump

        - conditions:
            - condition: state
              entity_id: sensor.home_heat_pump_operation
              state: "on"
          sequence:
            - action: climate.turn_on
              target:
                entity_id: climate.home_heat_pump
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.home_heat_pump
              data:
                hvac_mode: heat


            # HER skal Panasonic offset sættes
            - action: number.set_value
              target:
                entity_id: number.central_heat_pump_temperature_offset
              data:
                value: "{{ offset }}"

  triggers:
    - trigger: state
      entity_id: sensor.living_room_heat_pump_mode

    - trigger: state
      entity_id: binary_sensor.living_room_window

    - trigger: state
      entity_id: binary_sensor.patio_door_long_open

    - trigger: state
      entity_id: binary_sensor.kitchen_window

  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: sensor.living_room_heat_pump_mode
              state: boost

            - condition: state
              entity_id: binary_sensor.living_room_window
              state: "off"

            - condition: state
              entity_id: binary_sensor.patio_door_long_open
              state: "off"

            - condition: state
              entity_id: binary_sensor.kitchen_window
              state: "off"

          sequence:
            - action: climate.turn_on
              target:
                entity_id: climate.living_room_heat_pump

            - action: climate.set_temperature
              target:
                entity_id: climate.living_room_heat_pump
              data:
                temperature: "{{ states('sensor.living_room_target_temperature') | float(0) + 1 }}"

            - action: climate.set_hvac_mode
              target:
                entity_id: climate.living_room_heat_pump
              data:
                hvac_mode: heat

            - action: climate.set_fan_mode
              target:
                entity_id: climate.living_room_heat_pump
              data:
                fan_mode: Auto

            - action: climate.set_swing_mode
              target:
                entity_id: climate.living_room_heat_pump
              data:
                swing_mode: Auto

            - action: climate.set_preset_mode
              target:
                entity_id: climate.living_room_heat_pump
              data:
                preset_mode: boost

        - conditions:
            - condition: state
              entity_id: sensor.living_room_heat_pump_mode
              state: heat

            - condition: state
              entity_id: binary_sensor.living_room_window
              state: "off"

            - condition: state
              entity_id: binary_sensor.patio_door_long_open
              state: "off"

            - condition: state
              entity_id: binary_sensor.kitchen_window
              state: "off"

          sequence:
            - action: climate.turn_on
              target:
                entity_id: climate.living_room_heat_pump

            - action: climate.set_temperature
              target:
                entity_id: climate.living_room_heat_pump
              data:
                temperature: "{{ states('sensor.living_room_target_temperature') | float(0) + 1 }}"

            - action: climate.set_hvac_mode
              target:
                entity_id: climate.living_room_heat_pump
              data:
                hvac_mode: heat

            - action: climate.set_fan_mode
              target:
                entity_id: climate.living_room_heat_pump
              data:
                fan_mode: Auto

            - action: climate.set_swing_mode
              target:
                entity_id: climate.living_room_heat_pump
              data:
                swing_mode: Auto

            - action: climate.set_preset_mode
              target:
                entity_id: climate.living_room_heat_pump
              data:
                preset_mode: none

        - conditions:
            - condition: state
              entity_id: sensor.living_room_heat_pump_mode
              state: "off"

            - condition: not
              conditions:
                - condition: state
                  entity_id: climate.living_room_heat_pump
                  state: "off"

          sequence:
            - action: climate.turn_off
              target:
                entity_id: climate.living_room_heat_pump

            - action: climate.set_preset_mode
              target:
                entity_id: climate.living_room_heat_pump
              data:
                preset_mode: none
