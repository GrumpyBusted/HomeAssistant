- id: 0D38E6F4-98AB-4A12-B5CC-4EEEDFC56D14
  alias: Emils værelses dør
  description: |
    Automatik til at styre timer til emils værelses dør
  mode: queued
  max: 10
  trace:
    stored_traces: 50

  triggers:
    - trigger: state
      entity_id: binary_sensor.emils_room_door
      to: "off"
      id: closed

    - trigger: state
      entity_id: binary_sensor.emils_room_door
      to: "on"
      id: opened

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: closed
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.emils_room_door_timer

        - conditions:
            - condition: trigger
              id: opened
          sequence:
            - action: timer.start
              target:
                entity_id: timer.emils_room_door_timer
              data:
                duration: 00:02:00
