- id: D5A0E665-350E-49E7-8E24-85A6DE504A76
  alias: Indkørsel lys dekoration
  description: |
    Automatik til at julelys på huset i indkørslen
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.home_outside_light
      to: "off"
      id: twilight

    - trigger: time
      at:
        - "22:00:00"
        - "23:00:00"
        - "00:00:00"
        - "01:00:00"
      id: night

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: twilight
            - condition: template
              value_template: |-
                {{ now().month == 12 and now().day >= 1 and now().day <= 26 }}
          sequence:
            - action: light.turn_on
              data:
                brightness_pct: 90
                transition: 1
                rgb_color: [255, 20, 10]
              target:
                entity_id: light.driveway_light_strip_house

        - conditions:
            - condition: trigger
              id: twilight
            - condition: template
              value_template: |-
                {{ now().month == 10 and now().day >= 15 and now().day <= 31 }}
          sequence:
            action: light.turn_on
            data:
              brightness_pct: 70
              transition: 1
              rgb_color: [255, 30, 0]
            target:
              entity_id: light.driveway_light_strip_house

        - conditions:
            - condition: trigger
              id: night
            - condition: template
              value_template: |-
                {{ now().strftime('%d/%m') in('31/12', '24/12') }}
          sequence: []

        - conditions:
            - condition: trigger
              id: night
            - condition: template
              value_template: |-
                {{ now().strftime('%d/%m %H') in('01/01 01', '25/12 00') }}
          sequence:
            - action: light.turn_off
              data:
                transition: 1
              target:
                entity_id: light.driveway_light_strip_house

        - conditions:
            - condition: trigger
              id: night
            - condition: template
              value_template: |-
                {{ now().weekday() in [4,5] and now().hour >= 23 }}
          sequence:
            - action: light.turn_off
              data:
                transition: 1
              target:
                entity_id: light.driveway_light_strip_house

        - conditions:
            - condition: trigger
              id: night
            - condition: template
              value_template: |-
                {{ now().hour >= 22 }}
          sequence:
            - action: light.turn_off
              data:
                transition: 1
              target:
                entity_id: light.driveway_light_strip_house
