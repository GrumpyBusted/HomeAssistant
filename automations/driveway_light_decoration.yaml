- id: D5A0E665-350E-49E7-8E24-85A6DE504A76
  alias: Indkørsel lys dekoration
  description: |
    Automatik til at julelys på huset i indkørslen
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.home_light_decoration

  conditions: []

  actions:
    - variables:
        date: "{{ now().strftime('%m-%d') }}"

    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.home_light_decoration
              state: "off"
          sequence:
            - action: light.turn_off
              data:
                transition: 1
              target:
                entity_id: light.driveway_light_strip_house
        - conditions:
            - condition: template
              value_template: "{{ '10-15' <= date <= '10-31' }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.driveway_light_strip_house
              data:
                brightness_pct: 70
                transition: 1
                rgb_color: [255, 69, 0]
        - conditions:
            - condition: template
              value_template: "{{ '12-01' <= date <= '12-26' }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.driveway_light_strip_house
              data:
                brightness_pct: 90
                transition: 1
                rgb_color: [0, 128, 0]
        - conditions:
            - condition: template
              value_template: "{{ date >= '12-30' or date == '01-01' }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.driveway_light_strip_house
              data:
                brightness_pct: 90
                transition: 1
                rgb_color: [0, 100, 255]
