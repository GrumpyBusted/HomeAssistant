- id: garden_todo_pet_waste
  alias: Have todo kæledyr afføring
  description: |
    Opretter todo-opgaver om opsamling af hundeafføring i haven.
  mode: queued
  max: 10
  trace:
    stored_traces: 25

  triggers:
    - trigger: state
      entity_id: binary_sensor.utility_room_door
      to: "on"
      id: door_opened

    - trigger: time_pattern
      hours: "/1"
      id: check_pet_waste

    - trigger: state
      entity_id: binary_sensor.home_outside_light
      to: "on"
      id: light

    - trigger: state
      entity_id: binary_sensor.home_outside_light
      to: "off"
      id: dark

    - trigger: event
      event_type: todo_item_completed
      event_data:
        related: input_datetime.garden_pet_waste_last_removed
      id: todo_waste_completed

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - door_opened
                - check_pet_waste
                - light
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "on"
          sequence:
            - action: script.create_todo_task
              data:
                subject: Ryd gården efter hundene
                description: |-
                  Sidste gang der er samlet hundeefterladenskaber i gården var {{ as_datetime(states('input_datetime.garden_pet_waste_last_removed')).strftime('%-d/%-m-%Y kl. %H:%M') }}.
                related_entity_id: input_datetime.garden_pet_waste_last_removed
                entity_id: todo.todo_smart_todo
                is_active: |-
                  {% set h = (now().timestamp() - as_timestamp(states('input_datetime.garden_pet_waste_last_removed'))) / 60 / 60 %}
                  {% set c = states('counter.utility_room_door_sensor_open') | int(0) - states('input_number.garden_pet_waste_door_count_last_removed') | int(0) %}
                  {{ ((c >= 4 and h >= 48) or (c >= 15 and h >= 15)) }}

        - conditions:
            - condition: trigger
              id: dark
          sequence:
            - variables:
                existing: |-
                  {% set todos = state_attr('todo.todo_smart_todo', 'all_todos') | default([]) | rejectattr('status', 'equalto', 'completed') | list %} 
                  {% if todo_entity_id is not none %}
                    {{ todos
                      | selectattr('description', 'search', 'input_datetime.garden_pet_waste_last_removed' | trim)
                      | map(attribute='todo_id')
                      | list }}
                  {% else %}
                    {{ todos
                      | selectattr('subject', 'equalto', subject | trim)
                      | map(attribute='todo_id')
                      | list }}
                  {% endif %}
            - repeat:
                for_each: "{{ existing }}"
                sequence:
                  - action: ms365_todo.delete_todo
                    data:
                      entity_id: todo.todo_smart_todo
                      todo_id: "{{ repeat.item }}"

        - conditions:
            - condition: trigger
              id: todo_waste_completed
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.garden_pet_waste_last_removed
              data:
                datetime: "{{ now().isoformat() }}"
            - action: input_number.set_value
              target:
                entity_id: input_number.garden_pet_waste_door_count_last_removed
              data:
                value: "{{ states('counter.utility_room_door_sensor_open') | int(0) }}"
