- id: emils_room_air_purifier
  alias: Emils værelse blæser
  description: |
    Tænder Dyson Hot+Cool på Emils værelse for at varme rummet hurtigere op, når den ønskede temperatur er væsentligt højere end den aktuelle.
  mode: queued
  max: 10
  trace:
    stored_traces: 50

  triggers:
    - trigger: state
      entity_id: sensor.emils_room_air_purifier_mode

    - trigger: state
      entity_id: binary_sensor.emil_home

    - trigger: numeric_state
      entity_id: sensor.emils_room_air_quality_score
      above: 50

    - trigger: numeric_state
      entity_id: sensor.emils_room_air_quality_score
      below: 50

    - trigger: state
      entity_id: binary_sensor.emils_room_light

    - trigger: state
      entity_id: binary_sensor.emils_room_window
      to: "on"
      id: window_opened

    - trigger: state
      entity_id: binary_sensor.emils_room_window
      to: "off"
      id: window_closed

    - trigger: state
      entity_id: timer.emils_room_air_purifier_timer
      to: idle
      id: timeout

  conditions: []

  actions:
    - variables:
        mode: "off"

    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.emil_home
              state: "off"
          sequence: []

        - conditions:
            - condition: trigger
              id: timeout
          sequence: []

        - conditions:
            - condition: trigger
              id: window_opened
          sequence:
            - variables:
                mode: fan
            - action: timer.start
              data:
                duration: 00:10:00
              target:
                entity_id: timer.emils_room_air_purifier_timer

        - conditions:
            - condition: trigger
              id: window_closed
            - condition: state
              entity_id: timer.emils_room_air_purifier_timer
              state: active
          sequence:
            - variables:
                mode: "off"
            - action: timer.cancel
              target:
                entity_id: timer.emils_room_air_purifier_timer

        - conditions:
            - condition: state
              entity_id: sensor.emils_room_air_purifier_mode
              state: heat
            - condition: state
              entity_id: binary_sensor.emils_room_window
              state: "off"
          sequence:
            - variables:
                mode: heat

        - conditions:
            - condition: state
              entity_id: sensor.emils_room_air_purifier_mode
              state: cool
          sequence:
            - variables:
                mode: cool

        - conditions:
            - condition: numeric_state
              entity_id: sensor.emils_room_air_quality_score
              below: 50
            - condition: state
              entity_id: binary_sensor.emils_room_window
              state: "off"
          sequence:
            - variables:
                mode: filter

    - choose:
        - conditions:
            - condition: template
              value_template: |-
                {{ mode == 'off' }}
          sequence:
            - action: script.operate_air_purifier
              data:
                climate_entity: climate.emils_room_air_purifier
                operation: "off"

        - conditions:
            - condition: template
              value_template: |-
                {{ mode == 'heat' }}
          sequence:
            - action: script.operate_air_purifier
              data:
                climate_entity: climate.emils_room_air_purifier
                operation: "heat"
                night_mode: "{{ is_state('select.emils_room_light', 'off') }}"
                target_temperature: "{{ states('sensor.emils_room_target_temperature') | float(0.0) + 3 }}"

        - conditions:
            - condition: template
              value_template: |-
                {{ mode == 'cool' }}
          sequence:
            - action: script.operate_air_purifier
              data:
                climate_entity: climate.emils_room_air_purifier
                operation: "cool"
                night_mode: "{{ is_state('select.emils_room_light', 'off') }}"
                target_temperature: "{{ states('sensor.emils_room_target_temperature') | float(0.0) - 3 }}"

        - conditions:
            - condition: template
              value_template: |-
                {{ mode == 'fan' }}
          sequence:
            - action: script.operate_air_purifier
              data:
                climate_entity: climate.emils_room_air_purifier
                operation: "fan"
                night_mode: "{{ is_state('select.emils_room_light', 'off') }}"

        - conditions:
            - condition: template
              value_template: |-
                {{ mode == 'filter' }}
          sequence:
            - action: script.operate_air_purifier
              data:
                climate_entity: climate.emils_room_air_purifier
                operation: "filter"
                night_mode: "{{ is_state('select.emils_room_light', 'off') }}"
