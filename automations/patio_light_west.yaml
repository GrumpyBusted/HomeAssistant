- id: patio_light_west
  alias: Terrasse lys vest
  description: |
    Styrer havebelysningen vest for terrassen.
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.garage_presence_north
      from: "off"
      to: "on"
      id: detected

    - trigger: state
      entity_id: binary_sensor.garage_presence_north
      from: "on"
      to: "off"
      id: cleared

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: detected
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              data:
                brightness_pct: 100
                color_temp_kelvin: 2700
                transition: 1
              target:
                entity_id: light.patio_light_west

        - conditions:
            - condition: and
              conditions:
                - condition: trigger
                  id: cleared
                - condition: state
                  entity_id: binary_sensor.garage_presence_north
                  state: "off"
          sequence:
            - action: light.turn_off
              data:
                transition: 1
              target:
                entity_id: light.patio_light_west
