- id: bedroom_todo_air_purifier
  alias: Soveværelse todo blæser
  description: |
    Opretter todo-opgaver vedrørende blæseren i soveværelset.
  mode: queued
  max: 10
  trace:
    stored_traces: 30

  triggers:
    - trigger: numeric_state
      entity_id: sensor.bedroom_air_purifier_filter_life
      below: 5

    - trigger: time
      at: "03:20:00"

  conditions: []

  actions:
    - action: script.create_todo_task
      data:
        subject: Skift filter på blæser i soveværelset
        description: Luftrenser på soveværelset skal have skiftet filter, der er {{ states('sensor.bedroom_air_purifier_filter_life') }}% tilbage.
        related_entity_id: sensor.bedroom_air_purifier_filter_life
        entity_id: todo.todo_smart_todo
        is_active: "{{ states('sensor.bedroom_air_purifier_filter_life') | int(100) < 5 }}"
