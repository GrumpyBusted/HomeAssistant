- id: home_heat_pump_accumulate_energy
  alias: Hjem varmepumpe opsamle energi
  description: |
    Akkumulerer dagens energiforbrug ved nulstilling.
  mode: queued
  max: 5
  trace:
    stored_traces: 30

  triggers:
    - trigger: state
      entity_id: sensor.home_heat_pump_accumulated_consumption
      for: "00:01:00"

  conditions:
    - condition: template
      value_template: |-
        {{ trigger.from_state is not none and
           trigger.to_state is not none and
           is_number(trigger.from_state.state) and
           is_number(trigger.to_state.state) }}

  actions:
    - variables:
        previous: "{{ trigger.from_state.state | float(0) }}"
        current: "{{ trigger.to_state.state | float(0) }}"

    - if:
        - condition: template
          value_template: "{{ previous > current and current < 0.1 }}"
      then:
        - action: input_number.set_value
          target:
            entity_id: input_number.home_heat_pump_accumulated_energy
          data:
            value: |-
              {{ states('input_number.home_heat_pump_accumulated_energy') | float(0)
                + previous }}
