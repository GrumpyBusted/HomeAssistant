- id: home_todo_cleanup_task
  alias: Hjem todo oprydning opgaver
  description: |
    Sletter afsluttede opgaver fra den smart todo-liste.
  mode: restart
  trace:
    stored_traces: 30

  triggers:
    - trigger: time
      at: 02:01:00

  conditions: []

  actions:
    - action: script.cleanup_todo_tasks
      data:
        entity_id: todo.todo_smart_todo
        date: "{{ (now() - timedelta(days=2)).date() }}"
      response_variable: response
    - action: system_log.write
      data:
        level: info
        message: "Deleted: {{ response.deleted }}"
