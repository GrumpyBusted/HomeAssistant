- id: home_todo_soil_moisture_sensor
  alias: Hjem todo jordfugtighedssensor
  description: |
    Kontrollerer batteristatus for Haozee-jordfugtighedssensoren og opretter relevante todo-opgaver.
  mode: restart
  trace:
    stored_traces: 30

  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.living_room_soil_moisture_sensor_battery
        - sensor.bedroom_soil_moisture_sensor_battery
        - sensor.charlies_room_soil_moisture_sensor_battery
        - sensor.patio_soil_moisture_sensor_battery
      below: 10
      for: 00:03:00

    - trigger: numeric_state
      entity_id:
        - sensor.living_room_soil_moisture_sensor_battery
        - sensor.bedroom_soil_moisture_sensor_battery
        - sensor.charlies_room_soil_moisture_sensor_battery
        - sensor.patio_soil_moisture_sensor_battery
      above: 70
      for: 00:03:00

    - trigger: time
      at: 03:08:00

  conditions: []

  actions:
    - variables:
        sensors:
          - entity_id: sensor.living_room_soil_moisture_sensor_battery
          - entity_id: sensor.bedroom_soil_moisture_sensor_battery
          - entity_id: sensor.charlies_room_soil_moisture_sensor_battery
          - entity_id: sensor.patio_soil_moisture_sensor_battery
    - repeat:
        for_each: "{{ sensors }}"
        sequence:
          - action: script.create_todo_battery_task
            data:
              entity_id: "{{ repeat.item.entity_id }}"
              type: "2 x AAA"
