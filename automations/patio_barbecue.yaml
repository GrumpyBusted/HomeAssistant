- id: patio_barbecue
  alias: Terrasse grill
  description: |
    Advarer, hvis grillen er væsentligt varmere end terrassen i tre timer. Gentager alarmen hver time og sender en kritisk besked, hvis ingen er hjemme.
  mode: queued
  max: 10
  trace:
    stored_traces: 100

  triggers:
    - trigger: state
      entity_id: binary_sensor.patio_barbeque_hot
      to: "on"
      id: barbeque_on

    - trigger: state
      entity_id: binary_sensor.patio_barbeque_hot
      to: "off"
      id: barbeque_off

    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.patio_barbeque_hot_timer
      id: timer_finished

    - trigger: state
      entity_id: binary_sensor.someone_home
      to: "off"
      id: nobody_home

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: barbeque_on
          sequence:
            - action: timer.start
              target:
                entity_id: timer.patio_barbeque_hot_timer
              data:
                duration: "03:00:00"

        - conditions:
            - condition: trigger
              id: barbeque_off
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.patio_barbeque_hot_timer

        - conditions:
            - condition: trigger
              id:
                - nobody_home
                - timer_finished
            - condition: state
              entity_id: binary_sensor.patio_barbeque_hot
              state: "on"
          sequence:
            - action: script.push_notification
              data:
                type: warning
                title: Grillen er stadig varm
                id: patio_barbeque_warning
                recipient: home
                message: |
                  Grillen er stadig væsentligt varmere end terrassen.
                  Grill: {{ states('sensor.patio_temperature_sensor_barbeque_temperature') }} °C.
                  Terrasse: {{ states('sensor.patio_temperature_sensor_temperature') }} °C.
            - action: timer.start
              target:
                entity_id: timer.patio_barbeque_hot_timer
              data:
                duration: "01:00:00"
