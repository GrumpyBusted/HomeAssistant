- id: home_todo_vibration_sensor
  alias: Hjem todo vibrationssensor
  description: |
    Kontrollerer batteristatus for Aqara-vibrationssensorer og opretter relevante todo-opgaver.
  mode: restart
  trace:
    stored_traces: 30

  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.driveway_vibration_sensor_mailbox_battery
        - sensor.kitchen_vibration_sensor_dishwasher_battery
      below: 20
      for: 00:03:00

    - trigger: numeric_state
      entity_id:
        - sensor.driveway_vibration_sensor_mailbox_battery
        - sensor.kitchen_vibration_sensor_dishwasher_battery
      above: 70
      for: 00:03:00

    - trigger: time
      at: 03:06:00

  conditions: []

  actions:
    - variables:
        sensors:
          - entity_id: sensor.driveway_vibration_sensor_mailbox_battery
            temperature: "{{ states('sensor.driveway_vibration_sensor_mailbox_device_temperature') }}"
            location: på indersiden af låget
          - entity_id: sensor.kitchen_vibration_sensor_dishwasher_battery
            temperature: "{{ states('sensor.kitchen_vibration_sensor_dishwasher_device_temperature') }}"
            location: midt på lågens bagside, på indersiden
    - repeat:
        for_each: "{{ sensors }}"
        sequence:
          - action: script.create_todo_battery_task
            data:
              entity_id: "{{ repeat.item.entity_id }}"
              temperature: "{{ repeat.item.temperature }}"
              location: "{{ repeat.item.location }}"
              threshold: 20
