- id: utility_room_lock
  alias: Bryggers lås
  description: |
    Låser bryggersdøren op eller i afhængigt af, hvem der er hjemme.
  mode: queued
  max: 10
  trace:
    stored_traces: 100

  triggers:
    - trigger: state
      entity_id: binary_sensor.home_someone
      from: "on"
      to: "off"
      id: no_one_home

    - trigger: state
      entity_id: binary_sensor.home_sleeping_everyone
      from: "off"
      to: "on"
      id: sleeping

    - trigger: state
      entity_id: lock.utility_room_lock
      to: unlocked
      for: "00:01:00"
      id: unlocked

    - trigger: state
      entity_id: binary_sensor.utility_room_lock_cloud_door
      to: "off"
      id: lifted

    - trigger: state
      entity_id: timer.utility_room_lock_timer
      to: idle
      id: auto_locking_expired

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - no_one_home
                - sleeping
                - lifted
                - unlocked
            - condition: state
              entity_id: lock.utility_room_lock
              state: unlocked
            - condition: state
              entity_id: binary_sensor.utility_room_lock_cloud_door
              state: "off"
          sequence:
            - action: lock.lock
              target:
                entity_id: lock.utility_room_lock
            - action: timer.start
              target:
                entity_id: timer.utility_room_lock_timer
              data:
                duration: "00:01:00"

        - conditions:
            - condition: trigger
              id: auto_locking_expired
            - condition: state
              entity_id: lock.utility_room_lock
              state: unlocked
            - condition: or
              conditions:
                - condition: state
                  entity_id: binary_sensor.home_someone
                  state: "off"
                - condition: state
                  entity_id: binary_sensor.home_sleeping_everyone
                  state: "on"
          sequence:
            - action: script.push_notification
              data:
                type: warning
                title: Advarsel
                message: Bryggers døren kunne ikke låses automatisk!
                id: utility_room_lock_auto_warning
                recipient: home
                persistent: false
