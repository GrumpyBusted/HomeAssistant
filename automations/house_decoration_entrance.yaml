- id: house_decoration_entrance
  alias: Hus dekorationer entre
  description: |
    Styrer dekorationsbelysningen ved indgangen efter tidspunkt og sæson.
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.home_light_ambience

  conditions: []

  actions:
    - variables:
        date: "{{ now().strftime('%m-%d') }}"

    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.home_light_ambience
              state: "on"
          sequence:
            - choose:
                - conditions:
                    - condition: state
                      entity_id: sensor.home_light_ambience
                      state: halloween
                  sequence:
                    - action: script.light_turn_on_effect
                      data:
                        entity_id: light.house_decoration_entrance
                        entity_id_mode: select.house_decoration_entrance_mode
                        effect: Stripes
                - conditions:
                    - condition: state
                      entity_id: sensor.home_light_ambience
                      state: christmas
                  sequence:
                    - action: script.light_turn_on_effect
                      data:
                        entity_id: light.house_decoration_entrance
                        entity_id_mode: select.house_decoration_entrance_mode
                        effect: Sparkle
                - conditions:
                    - condition: state
                      entity_id: sensor.home_light_ambience
                      state: new_years
                  sequence:
                    - action: script.light_turn_on_effect
                      data:
                        entity_id: light.house_decoration_entrance
                        entity_id_mode: select.house_decoration_entrance_mode
                        effect: Rainbow
      default:
        - action: light.turn_off
          target:
            entity_id: light.house_decoration_entrance
