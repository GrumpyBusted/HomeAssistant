- id: home_todo_water_sensor
  alias: Hjem todo vandsensor
  description: |
    Kontrollerer batteristatus for Aqara-vandsensorer og opretter relevante todo-opgaver.
  mode: restart
  trace:
    stored_traces: 30

  triggers:
    - trigger: numeric_state
      entity_id:
        - sensor.kitchen_water_leak_sensor_sink_battery
        - sensor.utility_room_water_leak_sensor_sink_battery
      below: 10
      for: 00:03:00

    - trigger: numeric_state
      entity_id:
        - sensor.kitchen_water_leak_sensor_sink_battery
        - sensor.utility_room_water_leak_sensor_sink_battery
      above: 70
      for: 00:03:00

    - trigger: time
      at: 03:05:00

  conditions: []

  actions:
    - variables:
        sensors:
          - entity_id: sensor.kitchen_water_leak_sensor_sink_battery
            location: under opvaskemaskinen
          - entity_id: sensor.utility_room_water_leak_sensor_sink_battery
            location: under skabet, mellem rør
    - repeat:
        for_each: "{{ sensors }}"
        sequence:
          - action: script.create_todo_battery_task
            data:
              entity_id: "{{ repeat.item.entity_id }}"
              location: "{{ repeat.item.location | default('') }}"
