- id: bedroom_door
  alias: Soveværelse dør
  description: |
    Styrer timeren for døren til soveværelset.
  mode: queued
  max: 10
  trace:
    stored_traces: 50

  triggers:
    - trigger: state
      entity_id: binary_sensor.bedroom_door
      to: "off"
      id: closed

    - trigger: state
      entity_id: binary_sensor.bedroom_door
      to: "on"
      id: opened

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: closed
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.bedroom_door_sensor_timer

        - conditions:
            - condition: trigger
              id: opened
          sequence:
            - action: timer.start
              target:
                entity_id: timer.bedroom_door_sensor_timer
              data:
                duration: "00:02:00"
