- id: BB300AED-3BD0-487B-AF94-B9EE34FD89AF
  alias: Indkørsel billader advarsel
  description: |
    Overvåg billader i indkørsel, send beskeder hvis der tilsluttes en ukendt bil
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: sensor.driveway_ev_charger_state_description_safe
      to: Locked, car connected

  conditions: []

  actions:
    - if:
        - condition: state
          entity_id: sensor.driveway_ev_charger_state_description_safe
          state: Locked, car connected
        - condition: not
          conditions:
            - condition: or
              conditions:
                - condition: and
                  conditions:
                    - condition: state
                      entity_id: device_tracker.volvo_xc40_location
                      state: home
                    - condition: state
                      entity_id: sensor.volvo_xc40_charging_connection_state
                      state: connected
                - condition: and
                  conditions:
                    - condition: state
                      entity_id: sensor.ford_explorer_ev_tracker_safe
                      state: home
                    - condition: state
                      entity_id: sensor.ford_explorer_ev_el_plug_safe
                      state: CONNECTED
      then:
        - if:
            - condition: state
              entity_id: binary_sensor.someone_home
              state: "on"
          then:
            - action: script.push_notification
              data:
                type: warning
                title: Advarsel
                id: driveway_ev_charger_connected_unknown
                recipient: home
                message: Der er en ukendt bil tilsluttet til vores billader i indkørslen
          else:
            - action: script.push_notification
              data:
                type: warning
                title: Advarsel
                id: driveway_ev_charger_connected_unknown
                recipient: all
                message: Der er en ukendt bil tilsluttet til vores billader i indkørslen
