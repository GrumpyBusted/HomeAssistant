- id: kitchen_dishwasher
  alias: Køkken opvaskemaskine
  description: |
    Deaktiverer de relevante entiteter for opvaskemaskinen i køkkenet.
  mode: restart
  trace:
    stored_traces: 30

  triggers:
    - trigger: state
      entity_id: sensor.kitchen_dishwasher

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: sensor.kitchen_dishwasher
              state: "off"
          sequence:
            - action: homeassistant.disable_entity
              data:
                entity_id: sensor.kitchen_dishwasher_energy_consumption

      default:
        - action: homeassistant.enable_entity
          data:
            entity_id: sensor.kitchen_dishwasher_energy_consumption
