- id: garden_light_house_east
  alias: Have lys hus øst
  description: |
    Styrer havebelysningen på østsiden af huset.
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.garden_presence_house_east
      from: "off"
      to: "on"
      id: detected_east

    - trigger: state
      entity_id: binary_sensor.garden_presence_house_east
      from: "on"
      to: "off"
      id: cleared_east

    - trigger: state
      entity_id: binary_sensor.driveway_presence_entrance
      from: "off"
      to: "on"
      id: detected_entrance

    - trigger: state
      entity_id: binary_sensor.driveway_presence_entrance
      from: "on"
      to: "off"
      id: cleared_entrance

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - detected_east
                - detected_entrance
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              data:
                brightness_pct: 100
                color_temp_kelvin: 2700
                transition: 1
              target:
                entity_id: light.garden_light_house_east

        - conditions:
            - condition: trigger
              id:
                - cleared_east
                - cleared_entrance
            - condition: state
              entity_id: binary_sensor.garden_presence_house_east
              state: "off"
            - condition: state
              entity_id: binary_sensor.driveway_presence_entrance
              state: "off"
          sequence:
            - action: light.turn_off
              data:
                transition: 1
              target:
                entity_id: light.garden_light_house_east
