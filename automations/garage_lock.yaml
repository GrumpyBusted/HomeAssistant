- id: garage_lock
  alias: Garage lås
  description: |
    Låser garagedøren op eller i afhængigt af, hvem der er hjemme.
  mode: queued
  max: 10
  trace:
    stored_traces: 100

  triggers:
    - trigger: state
      entity_id:
        - sensor.anders_room
        - sensor.monique_room
        - sensor.emil_room
        - sensor.charlie_room
      to: Garage
      id: person_at_garage

    - trigger: state
      entity_id: binary_sensor.home_someone
      from: "on"
      to: "off"
      id: no_one_home

    - trigger: state
      entity_id: binary_sensor.home_sleeping_everyone
      from: "off"
      to: "on"
      id: sleeping

    - trigger: state
      entity_id: lock.garage_lock
      to: unlocked
      for: "00:01:00"
      id: unlocked

    - trigger: state
      entity_id: binary_sensor.garage_lock_ready
      to: "on"
      id: ready

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: person_at_garage
          sequence:
            - action: script.home_unlock_door
              data:
                lock: lock.garage_lock
                cloud_lock: lock.garage_lock_cloud
                bluetooth_lock: lock.garage_lock_bluetooth
                wake_button: button.garage_lock_cloud_wake
                person: "{{ trigger.entity_id.split('.')[1].replace('_room', '') }}"

        - conditions:
            - condition: trigger
              id:
                - no_one_home
                - sleeping
                - unlocked
                - ready
          sequence:
            - action: script.home_lock_door
              data:
                lock: lock.garage_lock
                cloud_lock: lock.garage_lock_cloud
                bluetooth_lock: lock.garage_lock_bluetooth
                lock_ready: binary_sensor.garage_lock_ready
                wake_button: button.garage_lock_cloud_wake
