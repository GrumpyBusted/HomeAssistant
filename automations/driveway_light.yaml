- id: "1737916297775"
  alias: Indkørsel lys
  description: |
    Automatik til at styre lys i indkørsel
  mode: queued
  max: 10
  trace:
    stored_traces: 100

  triggers:
    - trigger: state
      entity_id: binary_sensor.driveway_street_presence
      from: "off"
      to: "on"
      id: detected_street

    - trigger: state
      entity_id: binary_sensor.driveway_street_presence
      from: "on"
      to: "off"
      id: cleared_street

    - trigger: state
      entity_id: binary_sensor.driveway_house_south_presence
      from: "off"
      to: "on"
      id: detected_south

    - trigger: state
      entity_id: binary_sensor.driveway_house_south_presence
      from: "on"
      to: "off"
      id: cleared_south

    - trigger: state
      entity_id: binary_sensor.driveway_entrance_presence
      from: "off"
      to: "on"
      id: detected_entrance

    - trigger: state
      entity_id: binary_sensor.driveway_entrance_presence
      from: "on"
      to: "off"
      id: cleared_entrance

    - trigger: state
      entity_id: binary_sensor.garden_house_east_presence
      from: "off"
      to: "on"
      id: detected_east

    - trigger: state
      entity_id: binary_sensor.garden_house_east_presence
      from: "on"
      to: "off"
      id: cleared_east

    - trigger: state
      entity_id: binary_sensor.home_outside_light
      from: "off"
      to: "on"
      id: light_outside

    - trigger: state
      entity_id: binary_sensor.home_light_decoration
      from: "off"
      to: "on"
      id: decoration_on

    - trigger: state
      entity_id: binary_sensor.home_light_decoration
      from: "on"
      to: "off"
      id: decoration_off

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: detected_south
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id:
                  - light.driveway_lights_group
                  - light.driveway_light_left_1
                  - light.driveway_light_right_1
              data:
                brightness_pct: 100
                color_temp_kelvin: 3000
                transition: 1

        - conditions:
            - condition: trigger
              id: detected_street
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id:
                  - light.driveway_lights_group
                  - light.driveway_light_left_1
                  - light.driveway_light_right_1
              data:
                brightness_pct: 100
                color_temp_kelvin: 3000
                transition: 1

        - conditions:
            - condition: trigger
              id: detected_entrance
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id: light.driveway_lights_group
              data:
                brightness_pct: 100
                color_temp_kelvin: 3000
                transition: 1

        - conditions:
            - condition: trigger
              id: detected_east
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              data:
                brightness_pct: 100
                transition: 1
                color_temp_kelvin: 3000
              target:
                entity_id:
                  - light.driveway_light_left_1

        - conditions:
            - condition: trigger
              id:
                - cleared_street
                - cleared_south
                - cleared_entrance
                - cleared_east
                - decoration_on
            - condition: state
              entity_id: binary_sensor.driveway_street_presence
              state: "off"
            - condition: state
              entity_id: binary_sensor.driveway_house_south_presence
              state: "off"
            - condition: state
              entity_id: binary_sensor.driveway_entrance_presence
              state: "off"
            - condition: state
              entity_id: binary_sensor.garden_house_east_presence
              state: "off"
            - condition: state
              entity_id: binary_sensor.home_light_decoration
              state: "on"
          sequence:
            - variables:
                date: "{{ now().strftime('%m-%d') }}"
                day: "{{['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'][now().weekday()] }}"
                week: "{{ now().isocalendar().week }}"

            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ date <= '02-04' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_world_cancer_day
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ date <= '02-14' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_valentines
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ date <= '03-08' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_international_womens_day
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ date <= '03-17' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_sankt_patrick
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ date <= '04-02' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_autism_awareness_day
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ date <= '04-22' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_earth_day
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ date <= '05-17' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_idahobit
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ week <= 40 and day == 'Sa' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_breast_cancer_awareness
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ date <= '10-10' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_mental_health_awareness
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ '10-15' <= date <= '10-31' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_halloween
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ date <= '11-14' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_diabetes_awareness
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ date <= '12-01' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_world_aids_day
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ '12-02' <= date <= '12-26' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_christmas
                      data:
                        transition: 1
                - conditions:
                    - condition: template
                      value_template: "{{ '12-30' <= date or date == '01-01' }}"
                  sequence:
                    - action: scene.turn_on
                      target:
                        entity_id: scene.driveway_light_new_years
                      data:
                        transition: 1
              default:
                - action: scene.turn_on
                  target:
                    entity_id: scene.driveway_light_twlight
                  data:
                    transition: 1

        - conditions:
            - condition: trigger
              id:
                - cleared_street
                - cleared_south
                - cleared_entrance
                - cleared_east
                - decoration_off
                - light_outside
            - condition: or
              conditions:
                - condition: state
                  entity_id: binary_sensor.home_outside_light
                  state: "on"
                - condition: and
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.home_light_decoration
                      state: "off"
                    - condition: state
                      entity_id: binary_sensor.driveway_street_presence
                      state: "off"
                    - condition: state
                      entity_id: binary_sensor.driveway_house_south_presence
                      state: "off"
                    - condition: state
                      entity_id: binary_sensor.driveway_entrance_presence
                      state: "off"
                    - condition: state
                      entity_id: binary_sensor.garden_house_east_presence
                      state: "off"
          sequence:
            - action: light.turn_off
              continue_on_error: true
              target:
                entity_id:
                  - light.driveway_lights_group
                  - light.driveway_light_left_1
                  - light.driveway_light_right_1
