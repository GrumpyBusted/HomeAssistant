- id: driveway_light
  alias: Indkørsel lys
  description: |
    Styrer belysningen i indkørslen.
  mode: queued
  max: 10
  trace:
    stored_traces: 100

  triggers:
    - trigger: state
      entity_id: binary_sensor.driveway_presence_street
      from: "off"
      to: "on"
      id: detected_street

    - trigger: state
      entity_id: binary_sensor.driveway_presence_street
      from: "on"
      to: "off"
      id: cleared_street

    - trigger: state
      entity_id: binary_sensor.house_presence_south
      from: "off"
      to: "on"
      id: detected_south

    - trigger: state
      entity_id: binary_sensor.house_presence_south
      from: "on"
      to: "off"
      id: cleared_south

    - trigger: state
      entity_id: binary_sensor.house_presence_entrance
      from: "off"
      to: "on"
      id: detected_entrance

    - trigger: state
      entity_id: binary_sensor.house_presence_entrance
      from: "on"
      to: "off"
      id: cleared_entrance

    - trigger: state
      entity_id: binary_sensor.house_presence_east
      from: "off"
      to: "on"
      id: detected_east

    - trigger: state
      entity_id: binary_sensor.house_presence_east
      from: "on"
      to: "off"
      id: cleared_east

    - trigger: state
      entity_id: binary_sensor.home_outside_light
      from: "off"
      to: "on"
      id: light_outside

    - trigger: state
      entity_id: binary_sensor.home_light_ambience_evening
      from: "off"
      to: "on"
      id: decoration_on

    - trigger: state
      entity_id: binary_sensor.home_light_ambience_evening
      from: "on"
      to: "off"
      id: decoration_off

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: detected_south
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id:
                  - light.driveway_light_group
                  - light.driveway_light_left_1
                  - light.driveway_light_right_1
              data:
                brightness_pct: 100
                color_temp_kelvin: 3000
                transition: 1

        - conditions:
            - condition: trigger
              id: detected_street
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id:
                  - light.driveway_light_group
                  - light.driveway_light_left_1
                  - light.driveway_light_right_1
              data:
                brightness_pct: 100
                color_temp_kelvin: 3000
                transition: 1

        - conditions:
            - condition: trigger
              id: detected_entrance
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id:
                  - light.driveway_light_group
                  - light.driveway_light_left_1
              data:
                brightness_pct: 100
                color_temp_kelvin: 3000
                transition: 1

        - conditions:
            - condition: trigger
              id: detected_east
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              data:
                brightness_pct: 100
                transition: 1
                color_temp_kelvin: 3000
              target:
                entity_id:
                  - light.driveway_light_left_1

        - conditions:
            - condition: trigger
              id:
                - cleared_street
                - cleared_south
                - cleared_entrance
                - cleared_east
                - decoration_on
            - condition: state
              entity_id: binary_sensor.driveway_presence_street
              state: "off"
            - condition: state
              entity_id: binary_sensor.house_presence_south
              state: "off"
            - condition: state
              entity_id: binary_sensor.house_presence_entrance
              state: "off"
            - condition: state
              entity_id: binary_sensor.house_presence_east
              state: "off"
            - condition: state
              entity_id: binary_sensor.home_light_ambience_evening
              state: "on"
          sequence:
            - variables:
                scene: |-
                  {% set ambience = states('sensor.home_light_ambience') %}
                  {% if ambience not in ['none', 'unknown', 'unavailable'] %}
                    scene.driveway_light_{{ ambience }}
                  {% else %}
                    scene.driveway_light_twlight
                  {% endif %}

            - action: scene.turn_on
              target:
                entity_id: "{{ scene }}"
              data:
                transition: 1

        - conditions:
            - condition: trigger
              id:
                - cleared_street
                - cleared_south
                - cleared_entrance
                - cleared_east
                - decoration_off
                - light_outside
            - condition: or
              conditions:
                - condition: state
                  entity_id: binary_sensor.home_outside_light
                  state: "on"
                - condition: and
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.home_light_ambience_evening
                      state: "off"
                    - condition: state
                      entity_id: binary_sensor.driveway_presence_street
                      state: "off"
                    - condition: state
                      entity_id: binary_sensor.house_presence_south
                      state: "off"
                    - condition: state
                      entity_id: binary_sensor.house_presence_entrance
                      state: "off"
                    - condition: state
                      entity_id: binary_sensor.house_presence_east
                      state: "off"
          sequence:
            - action: light.turn_off
              continue_on_error: true
              target:
                entity_id:
                  - light.driveway_light_group
                  - light.driveway_light_left_1
                  - light.driveway_light_right_1
