- id: garage_motion_sensor_north
  alias: Garage bevægelsessensor nord
  description: |
    Håndterer bevægelsessensoren nord for garagen.
  mode: queued
  max: 10
  trace:
    stored_traces: 5

  triggers:
    - trigger: state
      entity_id: binary_sensor.garage_motion_sensor_north_occupancy
      from: "off"
      to: "on"
      id: detected

    - trigger: state
      entity_id: binary_sensor.garage_motion_sensor_north_occupancy
      from: "on"
      to: "off"
      id: cleared

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: detected
          sequence:
            - action: timer.cancel
              target:
                entity_id: timer.garage_motion_sensor_north_timer

        - conditions:
            - condition: trigger
              id: cleared
          sequence:
            - action: timer.start
              data:
                duration: 00:03:00
              target:
                entity_id: timer.garage_motion_sensor_north_timer
