- id: bedroom_air_purifier
  alias: Soveværelse blæser
  description: |
    Tænder Dyson Hot+Cool i soveværelset for at varme rummet hurtigere op, når den ønskede temperatur er væsentligt højere end den aktuelle.
  mode: queued
  max: 10
  trace:
    stored_traces: 50

  triggers:
    - trigger: state
      entity_id: sensor.bedroom_air_purifier_mode

    - trigger: state
      entity_id: binary_sensor.home_parent

    - trigger: state
      entity_id: input_boolean.home_house_sitter

    - trigger: numeric_state
      entity_id: sensor.bedroom_air_quality_score
      above: 52
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.bedroom_air_quality_score
      below: 50
      for: "00:03:00"

    - trigger: state
      entity_id: binary_sensor.bedroom_window
      to: "on"
      id: window_opened

    - trigger: state
      entity_id: binary_sensor.bedroom_window
      to: "off"
      id: window_closed

    - trigger: state
      entity_id: timer.bedroom_air_purifier_timer
      to: idle
      id: timeout

    - trigger: state
      entity_id: select.bedroom_state

  conditions: []

  actions:
    - variables:
        mode: "off"
    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.home_parent
              state: "off"
            - condition: state
              entity_id: input_boolean.home_house_sitter
              state: "off"
          sequence: []

        - conditions:
            - condition: trigger
              id: window_opened
          sequence:
            - variables:
                mode: fan
            - action: timer.start
              target:
                entity_id: timer.bedroom_air_purifier_timer
              data:
                duration: "00:10:00"

        - conditions:
            - condition: trigger
              id: window_closed
            - condition: state
              entity_id: timer.bedroom_air_purifier_timer
              state: active
          sequence:
            - variables:
                mode: "off"
            - action: timer.cancel
              target:
                entity_id: timer.bedroom_air_purifier_timer

        - conditions:
            - condition: state
              entity_id: sensor.bedroom_air_purifier_mode
              state: heat
            - condition: state
              entity_id: binary_sensor.bedroom_window
              state: "off"
            - condition: state
              entity_id: select.bedroom_state
              state:
                - wake_up
                - sleeping
                - wind_down
                - occupied
                - empty
          sequence:
            - variables:
                mode: heat

        - conditions:
            - condition: state
              entity_id: sensor.bedroom_air_purifier_mode
              state: cool
            - condition: state
              entity_id: select.bedroom_state
              state:
                - wake_up
                - sleeping
                - wind_down
                - occupied
                - empty
          sequence:
            - variables:
                mode: cool

        - conditions:
            - condition: numeric_state
              entity_id: sensor.bedroom_air_quality_score
              below: 50
            - condition: state
              entity_id: binary_sensor.bedroom_window
              state: "off"
            - condition: state
              entity_id: select.bedroom_state
              state:
                - wake_up
                - occupied
                - empty
          sequence:
            - variables:
                mode: filter

    - choose:
        - conditions:
            - condition: template
              value_template: |-
                {{ mode == 'off' }}
          sequence:
            - action: script.operate_air_purifier
              data:
                climate_entity: climate.bedroom_air_purifier
                operation: "off"
                angle_low: 225
                angle_high: 225

        - conditions:
            - condition: template
              value_template: |-
                {{ mode == 'heat' }}
          sequence:
            - action: script.operate_air_purifier
              data:
                climate_entity: climate.bedroom_air_purifier
                operation: "heat"
                night_mode: "{{ states('select.bedroom_state') in ['wind_down', 'sleeping', 'quiet_time', 'wake_up_soon'] }}"
                target_temperature: "{{ states('sensor.bedroom_target_temperature') | float(0.0) + 3 }}"
                angle_low: 155
                angle_high: 225

        - conditions:
            - condition: template
              value_template: |-
                {{ mode == 'cool' }}
          sequence:
            - action: script.operate_air_purifier
              data:
                climate_entity: climate.bedroom_air_purifier
                operation: "cool"
                night_mode: "{{ states('select.bedroom_state') in ['wind_down', 'sleeping', 'quiet_time', 'wake_up_soon'] }}"
                target_temperature: "{{ states('sensor.bedroom_target_temperature') | float(0.0) - 3 }}"
                angle_low: 155
                angle_high: 225

        - conditions:
            - condition: template
              value_template: |-
                {{ mode == 'fan' }}
          sequence:
            - action: script.operate_air_purifier
              data:
                climate_entity: climate.bedroom_air_purifier
                operation: "fan"
                night_mode: "{{ states('select.bedroom_state') in ['wind_down', 'sleeping', 'quiet_time', 'wake_up_soon'] }}"
                angle_low: 155
                angle_high: 225

        - conditions:
            - condition: template
              value_template: |-
                {{ mode == 'filter' }}
          sequence:
            - action: script.operate_air_purifier
              data:
                climate_entity: climate.bedroom_air_purifier
                operation: "filter"
                night_mode: "{{ states('select.bedroom_state') in ['wind_down', 'sleeping', 'quiet_time', 'wake_up_soon'] }}"
                angle_low: 155
                angle_high: 225
