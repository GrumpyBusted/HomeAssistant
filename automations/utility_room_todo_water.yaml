- id: utility_room_todo_water
  alias: Bryggers todo vand
  description: |
    Overvåger for vand under vasken i bryggerset og sender besked ved lækage.
  mode: queued
  max: 10
  trace:
    stored_traces: 30

  triggers:
    - trigger: state
      entity_id: binary_sensor.utility_room_water_leak_sensor_sink
      to: "on"
      for: 00:00:30
      id: leak

    - trigger: state
      entity_id: binary_sensor.utility_room_water_leak_sensor_sink
      to: "off"
      for: 00:00:30

    - trigger: time_pattern
      hours: "/1"

  conditions: []

  actions:
    - if:
        - condition: trigger
          id: leak
      then:
        - action: script.push_notification
          data:
            type: warning
            title: Advarsel
            id: utility_room_sink_water_leak
            persistent: false
            recipient: home
            message: Vand lækage sensoren der ligger under skabet med vasken i bryggerst har registret vand.

    - action: script.create_todo_task
      data:
        subject: Vand på gulvet under bryggersvasken
        entity_id: todo.todo_smart_todo
        description: Vand lækage sensoren der ligger under skabet med vasken i bryggerst har registret vand.
        related_entity_id: binary_sensor.utility_room_water_leak_sensor_sink
        is_active: "{{ is_state('binary_sensor.utility_room_water_leak_sensor_sink', 'on') }}"
