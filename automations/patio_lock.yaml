- id: patio_lock
  alias: Terrasse lås
  description: |
    Låser terrassedøren op eller i afhængigt af, hvem der er hjemme.
  mode: queued
  max: 10
  trace:
    stored_traces: 50

  triggers:
    - trigger: state
      entity_id: binary_sensor.home_someone
      from: "on"
      to: "off"
      id: no_one_home

    - trigger: state
      entity_id: binary_sensor.home_sleeping_everyone
      from: "off"
      to: "on"
      id: sleeping

    - trigger: state
      entity_id: lock.patio_lock
      to: unlocked
      for: "00:01:00"
      id: unlocked

    - trigger: state
      entity_id: binary_sensor.patio_lock_ready
      to: "on"
      id: ready

    - trigger: state
      entity_id: binary_sensor.living_room_light
      to: "off"
      id: living_room_light_off

    - trigger: state
      entity_id: binary_sensor.living_room_door_long_open
      to: "off"
      id: living_room_door_closed

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - living_room_light_off
                - living_room_door_closed
            - condition: state
              entity_id: binary_sensor.living_room_light
              state: "off"
            - condition: state
              entity_id: binary_sensor.living_room_door_long_open
              state: "off"
          sequence:
            - action: script.home_lock_door
              data:
                lock: lock.patio_lock
                cloud_lock: lock.patio_lock_cloud
                bluetooth_lock: lock.patio_lock_bluetooth
                lock_ready: binary_sensor.patio_lock_ready
                wake_button: button.patio_lock_cloud_wake

        - conditions:
            - condition: trigger
              id:
                - no_one_home
                - sleeping
                - unlocked
                - ready
          sequence:
            - action: script.home_lock_door
              data:
                lock: lock.patio_lock
                cloud_lock: lock.patio_lock_cloud
                bluetooth_lock: lock.patio_lock_bluetooth
                lock_ready: binary_sensor.patio_lock_ready
                wake_button: button.patio_lock_cloud_wake
