- id: patio_lock
  alias: Terrasse lås
  description: |
    Styrer låsen på terrassedøren.
  mode: queued
  max: 10
  trace:
    stored_traces: 50

  triggers:
    - trigger: state
      entity_id: binary_sensor.home_someone
      from: "on"
      to: "off"
      id: no_one_home

    - trigger: state
      entity_id: binary_sensor.home_sleeping_everyone
      from: "off"
      to: "on"
      id: sleeping

    - trigger: state
      entity_id: lock.patio_lock
      to: unlocked
      for: "00:01:00"
      id: unlocked

    - trigger: state
      entity_id: binary_sensor.patio_lock_cloud_door
      to: "off"
      id: lifted

    - trigger: state
      entity_id:
        - binary_sensor.living_room_light
        - binary_sensor.patio_light
      to: "off"
      for: "00:00:10"
      id: light_off

    - trigger: state
      entity_id: timer.patio_lock_timer
      to: idle
      id: auto_locking_expired

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - no_one_home
                - sleeping
                - unlocked
                - lifted
                - light_off
            - condition: state
              entity_id: lock.patio_lock
              state: unlocked
            - condition: state
              entity_id: binary_sensor.patio_lock_cloud_door
              state: "off"
          sequence:
            - action: lock.lock
              target:
                entity_id: lock.patio_lock
            - action: timer.start
              target:
                entity_id: timer.patio_lock_timer
              data:
                duration: "00:00:10"

        - conditions:
            - condition: trigger
              id: auto_locking_expired
            - condition: state
              entity_id: lock.patio_lock
              state: unlocked
          sequence:
            - action: script.push_notification
              data:
                type: warning
                title: Advarsel
                message: Terrassedøren kunne ikke låses automatisk!
                id: patio_lock_auto_warning
                recipient: home
                persistent: false
