- id: entrance_lock
  alias: Entre lås
  description: |
    Låser hoveddøren op eller i afhængigt af, hvem der er hjemme.
  use_blueprint:
    path: custom/lock_control.yaml
    input:
      lock: lock.entrance_lock
      cloud_lock: lock.entrance_lock_cloud
      bluetooth_lock: lock.entrance_lock_bluetooth
      lock_ready: binary_sensor.entrance_lock_ready
      wake_button: button.entrance_lock_cloud_wake
      person_home:
        - binary_sensor.anders_home
        - binary_sensor.monique_home
        - binary_sensor.emil_home
        - binary_sensor.charlie_home
      trace_count: 100
