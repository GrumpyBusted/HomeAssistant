- id: entrance_lock
  alias: Entre lås
  description: |
    Låser hoveddøren op eller i afhængigt af, hvem der er hjemme.
  mode: queued
  max: 10
  trace:
    stored_traces: 100

  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.anders_home
        - binary_sensor.monique_home
        - binary_sensor.emil_home
        - binary_sensor.charlie_home
      from: "off"
      to: "on"
      id: person_home

    - trigger: state
      entity_id: binary_sensor.home_someone
      from: "on"
      to: "off"
      id: no_one_home

    - trigger: state
      entity_id: binary_sensor.home_sleeping_everyone
      from: "off"
      to: "on"
      id: sleeping

    - trigger: state
      entity_id: select.bedroom_state
      to: wind_down
      id: bedroom_going_to_sleep

    - trigger: state
      entity_id: timer.entrance_lock_timer
      to: idle
      id: auto_locking_expired

    - trigger: state
      entity_id: lock.entrance_lock
      to: unlocked
      for: "00:01:00"
      id: unlocked

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: person_home
            - condition: state
              entity_id: lock.entrance_lock
              state: locked
          sequence:
            - variables:
                person: "{{ trigger.entity_id.split('.')[1].replace('_room', '') }}"
            - action: lock.unlock
              target:
                entity_id: lock.entrance_lock
              data:
                code: "{{ state_attr('sensor.yale_code', person) }}"

        - conditions:
            - condition: or
              conditions:
                - condition: trigger
                  id:
                    - no_one_home
                    - sleeping
                    - bedroom_going_to_sleep
            - condition: state
              entity_id: lock.entrance_lock
              state: unlocked
          sequence:
            - action: lock.lock
              target:
                entity_id: lock.entrance_lock
            - action: timer.start
              data:
                duration: 00:00:10
              target:
                entity_id: timer.entrance_lock_timer

        - conditions:
            - condition: trigger
              id: unlocked
            - condition: state
              entity_id: lock.entrance_lock
              state: unlocked
          sequence:
            - action: lock.lock
              target:
                entity_id: lock.entrance_lock
            - action: timer.start
              target:
                entity_id: timer.entrance_lock_timer
              data:
                duration: 00:00:10

        - conditions:
            - condition: trigger
              id: auto_locking_expired
            - condition: state
              entity_id: lock.entrance_lock
              state: unlocked
            - condition: or
              conditions:
                - condition: state
                  entity_id: binary_sensor.home_someone
                  state: "off"
                - condition: state
                  entity_id: binary_sensor.home_sleeping_everyone
                  state: "on"
          sequence:
            - action: script.push_notification
              data:
                type: warning
                title: Advarsel
                message: Hoveddøren kunne ikke låses automatisk!
                id: entrance_lock_auto_warning
                recipient: home
                persistent: false
