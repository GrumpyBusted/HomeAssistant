- id: toilet_todo
  alias: Toilet todo
  description: |
    Opretter todo-opgaver om genopfyldning af sæbe og duft på toilettet.
  mode: queued
  max: 10
  trace:
    stored_traces: 30

  triggers:
    - trigger: state
      entity_id: binary_sensor.toilet_presence
      to: "off"
      for: "00:00:05"
      id: person_left

    - trigger: state
      entity_id: counter.toilet_motion_sensor_count
      id: counter_changed

    - trigger: event
      event_type: todo_item_completed
      event_data:
        related: input_number.toilet_freshener_last_count
      id: freshener_completed

    - trigger: event
      event_type: todo_item_completed
      event_data:
        related: input_number.toilet_soap_last_count
      id: soap_completed

    - trigger: event
      event_type: todo_item_completed
      event_data:
        related: input_number.toilet_towel_last_count
      id: towel_completed

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: person_left
          sequence:
            - action: counter.increment
              target:
                entity_id: counter.toilet_motion_sensor_count

        - conditions:
            - condition: trigger
              id: counter_changed
          sequence:
            - action: script.create_todo_task
              data:
                subject: Tilføj WC-duft på toilettet
                description: Indsæt en ny WC-duftpind i toilettet på gæste-toilettet.
                related_entity_id: input_number.toilet_freshener_last_count
                entity_id: todo.todo_smart_todo
                is_active: "{{ states('counter.toilet_motion_sensor_count') | int(0) > states('input_number.toilet_freshener_last_count') | int(0) + 100 }}"

            - action: script.create_todo_task
              data:
                subject: Fyld sæbe på dispenser på toilettet
                description: Hæld mere sæbe på sæbedispenser på gæste-toilettet.
                related_entity_id: input_number.toilet_soap_last_count
                entity_id: todo.todo_smart_todo
                must_replace: true
                is_active: "{{ states('counter.toilet_motion_sensor_count') | int(0) > states('input_number.toilet_soap_last_count') | int(0) + 150 }}"

            - variables:
                towel_days: >
                  {% set last_changed = states('input_datetime.toilet_towel_last_changed') %} {% if last_changed not in ['unknown', 'unavailable', ''] %}
                    {{ (as_timestamp(now()) - as_timestamp(as_datetime(last_changed))) | int(0) // 86400 }}
                  {% else %}
                    999
                  {% endif %}


            - action: script.create_todo_task
              data:
                subject: Skift håndklæder på toilettet
                description: Skift de små håndklæder på gæste-toilettet, de blev sidst skiftet for {{ towel_days }} dage siden.
                related_entity_id: input_number.toilet_towel_last_count
                entity_id: todo.todo_smart_todo
                is_active: |-
                  {% set c = states('counter.toilet_motion_sensor_count') | int(0) %}
                  {% set l = states('input_number.toilet_towel_last_count') | int(0) %}
                  {{ (0 < towel_days < 10 and (c - l) > 20) or (towel_days >= 10 and (c - l) > 2) }}

        - conditions:
            - condition: trigger
              id: freshener_completed
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.toilet_freshener_last_count
              data:
                value: "{{ states('counter.toilet_motion_sensor_count') | int(0) }}"

        - conditions:
            - condition: trigger
              id: soap_completed
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.toilet_soap_last_count
              data:
                value: "{{ states('counter.toilet_motion_sensor_count') | int(0) }}"

        - conditions:
            - condition: trigger
              id: towel_completed
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.toilet_towel_last_count
              data:
                value: "{{ states('counter.toilet_motion_sensor_count') | int(0) }}"
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.toilet_towel_last_changed
              data:
                datetime: "{{ now() }}"
