- id: kitchen_dishwasher_state
  alias: Køkken opvaskemaskine status
  description: |
    Opdaterer opvaskemaskinens status.
  mode: queued
  max: 10
  trace:
    stored_traces: 100

  triggers:
    - trigger: state
      entity_id: sensor.kitchen_dishwasher
      id: dishwasher

    - trigger: state
      entity_id: sensor.kitchen_dishwasher_program_phase
      id: program_phase

    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_door_safe
      id: door

    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_door_safe
      to: "off"
      for: "00:00:30"
      id: door_closed

    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_vibration_sensor
      to: "on"
      id: door_motion

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: dishwasher
            - condition: state
              entity_id: sensor.kitchen_dishwasher
              state: waiting_to_start
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_dishwasher_state
              data:
                option: planned

        - conditions:
            - condition: trigger
              id: dishwasher
            - condition: state
              entity_id: sensor.kitchen_dishwasher
              state: in_use
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_dishwasher_state
              data:
                option: running
            - choose:
                - conditions:
                    - condition: state
                      entity_id: sensor.kitchen_dishwasher_program
                      state: intensive
                  sequence:
                    - action: counter.reset
                      target:
                        entity_id:
                          - counter.kitchen_dishwasher_washes_since_75
                          - counter.kitchen_dishwasher_washes_since_65
                    - action: input_datetime.set_datetime
                      target:
                        entity_id: input_datetime.kitchen_dishwasher_last_75
                      data:
                        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                - conditions:
                    - condition: state
                      entity_id: sensor.kitchen_dishwasher_program
                      state: power_wash
                  sequence:
                    - action: counter.increment
                      target:
                        entity_id: counter.kitchen_dishwasher_washes_since_75
                    - action: counter.reset
                      target:
                        entity_id: counter.kitchen_dishwasher_washes_since_65
              default:
                - action: counter.increment
                  target:
                    entity_id:
                      - counter.kitchen_dishwasher_washes_since_75
                      - counter.kitchen_dishwasher_washes_since_65

        - conditions:
            - condition: trigger
              id: dishwasher
            - condition: state
              entity_id: sensor.kitchen_dishwasher
              state: program_ended
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_dishwasher_state
              data:
                option: finishing

        - conditions:
            - condition: trigger
              id: door
            - condition: state
              entity_id: input_select.kitchen_dishwasher_state
              state: finishing
            - condition: state
              entity_id: binary_sensor.kitchen_dishwasher_door_safe
              state: "on"
            - condition: state
              entity_id: sensor.kitchen_dishwasher_program_phase
              state: finished
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_dishwasher_state
              data:
                option: clean

        - conditions:
            - condition: trigger
              id: door
            - condition: state
              entity_id: input_select.kitchen_dishwasher_state
              state: clean
            - condition: state
              entity_id: binary_sensor.kitchen_dishwasher_door_safe
              state: "on"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_dishwasher_state
              data:
                option: emptying

        - conditions:
            - condition: trigger
              id: door_closed
            - condition: state
              entity_id: input_select.kitchen_dishwasher_state
              state: emptying
            - condition: state
              entity_id: binary_sensor.kitchen_dishwasher_door_safe
              state: "off"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_dishwasher_state
              data:
                option: dirty

        - conditions:
            - condition: trigger
              id: door_motion
            - condition: state
              entity_id: input_select.kitchen_dishwasher_state
              state:
                - emptying
                - clean
                - finished
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_dishwasher_state
              data:
                option: dirty
