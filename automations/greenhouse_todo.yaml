- id: greenhouse_todo
  alias: Drivhus todo
  description: |
    Overvåger temperaturen i drivhuset og opretter påmindelser om vanding.
  mode: queued
  max: 10
  trace:
    stored_traces: 30

  triggers:
    - trigger: numeric_state
      entity_id: sensor.greenhouse_current_temperature
      below: -1
      id: freezing

    - trigger: numeric_state
      entity_id: sensor.greenhouse_current_temperature
      below: 5
      id: warm

    - trigger: time
      at: 03:00:00
      id: periodic

    - trigger: time
      at: "16:00:00"
      id: afternoon

  conditions: []

  actions:
    - action: script.create_todo_task
      data:
        subject: Tænd varmen i drivhuset
        description: '"Temperaturen i drivhuset er {{ states(''sensor.greenhouse_current_temperature'') }}, tænd for varme blæseren."'
        entity_id: todo.todo_smart_todo
        related_entity_id: sensor.greenhouse_current_temperature
        is_active: "{{ states('sensor.greenhouse_current_temperature') | float(10.0) < -1.0 and states('sensor.greenhouse_heating_smart_plug_power') | float(0.0) < 5.0 }}"

    - choose:
        - conditions:
            - condition: trigger
              id: afternoon
          sequence:
            - action: script.create_todo_task
              data:
                subject: Vand planterne i drivhuset
                description: |-
                  Vand planterne i drivhuset, og evt dem uden for drivhuset.
                entity_id: todo.todo_smart_todo
