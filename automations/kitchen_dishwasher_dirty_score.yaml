- id: kitchen_dishwasher_dirty_score
  alias: Køkken opvaskemaskine beskidt score
  description: |
    Opdaterer scoren for, hvor meget snavset service der er i opvaskemaskinen.
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_vibration_sensor
      to: "on"
      id: detected

    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_vibration_sensor
      to: "off"
      id: cleared

    - trigger: state
      entity_id: input_select.kitchen_dishwasher_state
      to: "running"
      id: dishwasher_running

    - trigger: time
      at:
        - "10:00:00"
        - "12:00:00"
        - "18:00:00"
      id: meal_time

    - trigger: event
      event_type: timer.finished
      event_data:
        entity_id: timer.home_people_meal_timer
      id: meal_done

    - trigger: state
      entity_id: number.home_people
      id: people_changed

    - trigger: state
      entity_id: input_number.kitchen_presence_duration
      from: "0"
      id: duration_changed

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: dishwasher_running
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.kitchen_dishwasher_dirty_score
              data:
                value: 0

        - conditions:
            - condition: trigger
              id: detected
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.kitchen_dishwasher_door_opened
              data:
                timestamp: "{{ now().timestamp() }}"

        - conditions:
            - condition: trigger
              id: cleared
            - condition: state
              entity_id: input_select.kitchen_dishwasher_state
              state: dirty
            - condition: template
              value_template: "{{ as_timestamp(states('input_datetime.kitchen_dishwasher_door_opened'), 0) > 0 }}"
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.kitchen_dishwasher_dirty_score
              data:
                value: |-
                  {% set s = now().timestamp() - (states('input_datetime.kitchen_dishwasher_door_opened') | as_timestamp(0)) %}
                  {% set v = [[(s / 60) | round(0) | int, 1] | max, 10] | min %}
                  {% set c = states('input_number.kitchen_dishwasher_dirty_score') | int(0) %}
                  {{ c + ([v, 10] | min) }}
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.kitchen_dishwasher_door_opened
              data:
                timestamp: 0

        - conditions:
            - condition: trigger
              id: duration_changed
            - condition: state
              entity_id: input_select.kitchen_dishwasher_state
              state: dirty
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.kitchen_dishwasher_dirty_score
              data:
                value: |-
                  {% set d = states('input_number.kitchen_presence_duration') | int(0) %}
                  {% if d >= 30 %}
                    {{ [3 + ((d - 31) // 10), 10] | min }}
                  {% else %}
                    0
                  {% endif %}

        - conditions:
            - condition: trigger
              id: meal_time
            - condition: template
              value_template: "{{ now().weekday() >= 5 and now().hour < 12 or now().hour >= 12 }}"
          sequence:
            - action: timer.start
              target:
                entity_id: timer.home_people_meal_timer
              data:
                duration: 02:00:00
            - action: input_number.set_value
              target:
                entity_id: input_number.home_people_meal
              data:
                value: |-
                  {{ states('number.home_people') | int(0) }}

        - conditions:
            - condition: trigger
              id: meal_done
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.kitchen_dishwasher_dirty_score
              data:
                value: |-
                  {{ states('input_number.kitchen_dishwasher_dirty_score') | int(0) + states('input_number.home_people_meal') | int(0) }}

        - conditions:
            - condition: trigger
              id: people_changed
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.home_people_meal
              data:
                value: |-
                  {{ max(states('input_number.home_people_meal') | int(0), states('number.home_people') | int(0)) }}
