- id: 69E96065-F650-42B7-95C9-FBA1FB8A17E3
  alias: Køkken opvaskemaskine beskidt score
  description: |
    Styring af score for hvor meget beskidt service der er i opvaskemaskinen
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_vibration_sensor
      to: "on"
      id: detected

    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_vibration_sensor
      to: "off"
      id: cleared

    - trigger: state
      entity_id: input_select.kitchen_dishwasher_state
      to: "running"
      id: dishwasher_running

    - trigger: time
      at:
        - "10:00:00"
        - "12:00:00"
        - "18:00:00"
      id: meal_time

    - trigger: state
      entity_id: timer.people_home_meal_timer
      to: idle
      id: meal_done

    - trigger: state
      entity_id: number.people_home
      id: people_changed

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: dishwasher_running
          sequence:
            - action: counter.reset
              target:
                entity_id: counter.kitchen_dishwasher_dirty_score

        - conditions:
            - condition: trigger
              id: detected
            - condition: state
              entity_id: input_select.kitchen_dishwasher_state
              state: dirty
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.kitchen_dishwasher_door_opened
              data:
                timestamp: "{{ now().timestamp() }}"

        - conditions:
            - condition: trigger
              id: cleared
            - condition: state
              entity_id: input_select.kitchen_dishwasher_state
              state: dirty
          sequence:
            - action: counter.set_value
              target:
                entity_id: counter.kitchen_dishwasher_dirty_score
              data:
                value: |-
                  {% set seconds = now().timestamp() - states('input_datetime.kitchen_dishwasher_door_opened') | as_timestamp(0) %}
                  {% set minutes = (seconds / 60) | round(0, 'ceil') | int %}
                  {{ states('counter.kitchen_dishwasher_dirty_score') | int(0) + minutes | int(0) }}

        - conditions:
            - condition: trigger
              id: meal_time
            - condition: template
              value_template: "{{ now().weekday() >= 5 and now().hour < 12 or now().hour >= 12 }}"
          sequence:
            - action: timer.start
              target:
                entity_id: timer.people_home_meal_timer
              data:
                duration: 02:00:00
            - action: input_number.set_value
              target:
                entity_id: input_number.people_home_meal
              data:
                value: |-
                  {{ states('number.people_home') | int(0) }}

        - conditions:
            - condition: trigger
              id: meal_done
          sequence:
            - action: counter.set_value
              target:
                entity_id: counter.kitchen_dishwasher_dirty_score
              data:
                value: |-
                  {{ states('counter.kitchen_dishwasher_dirty_score') | int(0) + states('input_number.people_home_meal') | int(0) }}

        - conditions:
            - condition: trigger
              id: people_changed
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.people_home_meal
              data:
                value: |-
                  {{ max(states('input_number.people_home_meal') | int(0), states('number.people_home') | int(0)) }}
