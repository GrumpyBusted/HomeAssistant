- id: 69E96065-F650-42B7-95C9-FBA1FB8A17E3
  alias: Køkken opvaskemaskine beskidt score
  description: |
    Styring af score for hvor meget beskidt service der er i opvaskemaskinen
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_door_safe
      to: "on"
      id: door_opened

    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_door_safe
      to: "off"
      id: door_closed

    - trigger: state
      entity_id: input_select.kitchen_dishwasher_state
      to: "running"
      id: dishwasher_running

    - trigger: state
      entity_id: binary_sensor.kitchen_presence
      to: "off"
      id: kitchen_empty

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: dishwasher_running
          sequence:
            - action: counter.reset
              target:
                entity_id: counter.kitchen_dishwasher_dirty_score

        - conditions:
            - condition: trigger
              id: door_opened
            - condition: state
              entity_id: input_select.kitchen_dishwasher_state
              state: dirty
          sequence:
            - action: counter.increment
              target:
                entity_id: counter.kitchen_dishwasher_dirty_score
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.kitchen_dishwasher_door_opened
              data:
                timestamp: "{{ now().timestamp() }}"

        - conditions:
            - condition: trigger
              id: kitchen_empty
            - condition: state
              entity_id: binary_sensor.kitchen_dishwasher_door_safe
              state: "on"
          sequence:
            - action: counter.increment
              target:
                entity_id: counter.kitchen_dishwasher_dirty_score
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.kitchen_dishwasher_door_opened
              data:
                timestamp: 0

        - conditions:
            - condition: trigger
              id: door_closed
            - condition: state
              entity_id: input_select.kitchen_dishwasher_state
              state: dirty
            - condition: template
              value_template: |-
                {{ states('input_datetime.kitchen_dishwasher_door_opened')
                  | as_timestamp(0) > 0 }}
          sequence:
            - variables:
                additional_score: |-
                  {% set seconds =
                    now().timestamp()
                    - states('input_datetime.kitchen_dishwasher_door_opened') | as_timestamp(0)
                  %} {% if seconds > 60 %}
                    5
                  {% elif seconds >= 30 %}
                    2
                  {% else %}
                    0
                  {% endif %}

            - action: counter.set_value
              target:
                entity_id: counter.kitchen_dishwasher_dirty_score
              data:
                value: >
                  {{ states('counter.kitchen_dishwasher_dirty_score') | int(0)
                    + additional_score | int(0) }}

