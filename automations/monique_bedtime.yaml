- id: monique_bedtime
  alias: Monique sengetid
  description: |
    Opdaterer Moniques sengetidshjælper, når webhooken kaldes.
  mode: restart
  trace:
    stored_traces: 10

  triggers:
    - trigger: webhook
      allowed_methods:
        - POST
      local_only: false
      webhook_id: monique-set-bedtime-CNwYS0I0HIbgeRZ1GmGOxxvS

  conditions: []

  actions:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.monique_bedtime_alarm
      data:
        datetime: "{{ now() + timedelta(seconds=10) }}"
