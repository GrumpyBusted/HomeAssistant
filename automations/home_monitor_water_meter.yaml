- id: home_monitor_water_meter
  alias: Hjem overvåg vandmåler
  description: |
    Overvåger vandmålerens data, status og alarmer.
  mode: queued
  max: 10
  trace:
    stored_traces: 200

  triggers:
    - trigger: mqtt
      topic: wmbusmeters/Vandforbrug
      id: data_received

    - trigger: state
      entity_id: binary_sensor.home_water_meter_state_burst
      to: "on"
      id: burst

    - trigger: state
      entity_id: binary_sensor.home_water_meter_state_leak
      to: "on"
      id: leak

    - trigger: state
      entity_id: binary_sensor.home_water_meter_state_dry
      to: "on"
      id: dry

    - trigger: state
      entity_id: binary_sensor.home_water_meter_
      to: "on"
      id: dry

    - trigger: time_pattern
      minutes: "/15"
      id: check_no_data

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: data_received
          sequence:
            - action: input_datetime.set_datetime
              target:
                entity_id: input_datetime.home_water_meter_last_updated
              data:
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

        # Rørbrud
        - conditions:
            - condition: trigger
              id: burst
          sequence:
            - action: script.push_notification
              data:
                type: warning
                title: Brud på vandrør
                id: home_water_meter_state_burst
                persistent: true
                recipient: home
                message: |-
                  Vandmåleren har registret rørbrud.
                  Status: {{ states('sensor.home_water_meter_status_text') }}
                  Tid med rørbrud: {{ states('sensor.home_water_meter_time_bursting') }}
                  Forbrug denne time: {{ states('sensor.home_water_usage_hourly') }}
                  Forbrug sidste time: {{ state_attr('sensor.home_water_usage_hourly', 'last_period') }}

        - conditions:
            - condition: trigger
              id: leak
          sequence:
            - action: script.push_notification
              data:
                type: warning
                title: Lækage på vandrør
                id: home_water_meter_state_leak
                persistent: true
                recipient: home
                message: |-
                  Vandmåleren har registret en lækage.
                  Status: {{ states('sensor.home_water_meter_status_text') }}
                  Tid med lækage: {{ states('sensor.home_water_meter_time_leaking') }}
                  Forbrug denne time: {{ states('sensor.home_water_usage_hourly') }}
                  Forbrug sidste time: {{ state_attr('sensor.home_water_usage_hourly', 'last_period') }}

        - conditions:
            - condition: trigger
              id: dry
          sequence:
            - action: script.push_notification
              data:
                type: warning
                title: Ingen vandtilførsel
                id: home_water_meter_state_dry
                persistent: true
                recipient: home
                message: |-
                  Vandmåleren registrerer manglende vandtilførsel.
                  Status: {{ states('sensor.home_water_meter_status_text') }}
                  Tid uden vand: {{ states('sensor.home_water_meter_time_dry') }}

        - conditions:
            - condition: trigger
              id: periodic_check
            - condition: template
              value_template: |-
                {{ as_local(as_datetime(states('input_datetime.home_water_meter_last_updated'))) < now() - timedelta(hours=24) }}
          sequence:
            - action: script.push_notification
              data:
                type: warning
                title: Mangler data fra vandmåler
                id: home_water_meter_last_updated
                persistent: true
                recipient: anders
                message: |-
                  Vandmåleren har ikke sendt data i over 24 timer.
                  Sidst opdateret: {{ states('input_datetime.home_water_meter_last_updated') }}
