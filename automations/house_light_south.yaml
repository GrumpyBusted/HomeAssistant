- id: house_light_south
  alias: Hus lys syd
  description: |
    Styrer belysningen på sydsiden af huset.
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.house_presence_south
      from: "off"
      to: "on"
      id: detected_south

    - trigger: state
      entity_id: binary_sensor.house_presence_south
      from: "on"
      to: "off"
      id: cleared_south

    - trigger: state
      entity_id: binary_sensor.house_presence_entrance
      from: "off"
      to: "on"
      id: detected_entrance

    - trigger: state
      entity_id: binary_sensor.house_presence_entrance
      from: "on"
      to: "off"
      id: cleared_entrance

    - trigger: state
      entity_id: binary_sensor.driveway_presence_street
      from: "off"
      to: "on"
      id: detected_street

    - trigger: state
      entity_id: binary_sensor.driveway_presence_street
      from: "on"
      to: "off"
      id: cleared_street

    - trigger: state
      entity_id: binary_sensor.house_presence_west
      from: "off"
      to: "on"
      id: detected_west

    - trigger: state
      entity_id: binary_sensor.house_presence_west
      from: "on"
      to: "off"
      id: cleared_west

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - detected_south
                - detected_entrance
                - detected_street
                - detected_west
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              data:
                brightness_pct: 100
                color_temp_kelvin: 2700
                transition: 1
              target:
                entity_id: light.house_light_south

        - conditions:
            - condition: trigger
              id:
                - cleared_south
                - cleared_entrance
                - cleared_street
                - cleared_west
            - condition: state
              entity_id: binary_sensor.house_presence_south
              state: "off"
            - condition: state
              entity_id: binary_sensor.house_presence_entrance
              state: "off"
            - condition: state
              entity_id: binary_sensor.driveway_presence_street
              state: "off"
            - condition: state
              entity_id: binary_sensor.house_presence_west
              state: "off"
          sequence:
            - action: light.turn_off
              data:
                transition: 1
              target:
                entity_id: light.house_light_south
