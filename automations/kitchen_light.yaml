- id: kitchen_light
  alias: Køkken lys
  description: |
    Styrer belysningen i køkkenet.
  mode: queued
  max: 10
  trace:
    stored_traces: 50

  triggers:
    - trigger: state
      entity_id: event.kitchen_switch_rotary
      id: rotary

    - trigger: state
      entity_id: binary_sensor.kitchen_light
      from: "off"
      to: "on"
      for: 00:15:00
      id: lights_on

    - trigger: state
      entity_id:
        - event.kitchen_switch_button_1
        - event.kitchen_switch_button_2
        - event.kitchen_switch_button_3
        - event.kitchen_switch_button_4
      attribute: event_type
      to: long_release
      id: button_long

    - trigger: state
      entity_id: event.kitchen_switch_button_1
      attribute: event_type
      to: short_release
      id: button_1_short

    - trigger: state
      entity_id: event.kitchen_switch_button_2
      attribute: event_type
      to: short_release
      id: button_2_short

    - trigger: state
      entity_id: event.kitchen_switch_button_3
      attribute: event_type
      to: short_release
      id: button_3_short

    - trigger: state
      entity_id: event.kitchen_switch_button_4
      attribute: event_type
      to: short_release
      id: button_4_short

    - trigger: state
      entity_id: binary_sensor.home_someone
      to: "off"
      id: no_one_home

    - trigger: state
      entity_id: binary_sensor.home_sleeping_everyone
      to: "on"
      id: sleeping

    - trigger: state
      entity_id: binary_sensor.living_room_light
      to: "off"
      id: living_room_light_off

    - trigger: state
      entity_id: binary_sensor.kitchen_presence

    - trigger: state
      entity_id: input_select.living_room_robot_vacuum_current_cleaning

    - trigger: state
      entity_id: binary_sensor.home_someone

    - trigger: state
      entity_id: binary_sensor.home_sleeping_everyone

    - trigger: state
      entity_id: binary_sensor.patio_door_long_open

    - trigger: state
      entity_id: binary_sensor.kitchen_window

    - trigger: state
      entity_id: binary_sensor.living_room_light

    - trigger: state
      entity_id: input_select.living_room_robot_vacuum_current_cleaning
      to: kitchen_cleaning

    - trigger: state
      entity_id: input_select.living_room_robot_vacuum_current_cleaning
      from: kitchen_cleaning

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      above: 10000
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      below: 10000
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      above: 8000
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      below: 8000
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      above: 1000
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      below: 1000
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      above: 100
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      below: 100
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      above: 1
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      below: 1
      for: "00:03:00"

  conditions: []

  actions:
    - variables:
        current_mode: "{{ states('input_select.kitchen_light_mode') }}"
        force: false

    - choose:
        - conditions:
            - condition: trigger
              id: rotary
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_light_mode
              data:
                option: custom
            - choose:
                - conditions:
                    - condition: state
                      entity_id: event.kitchen_switch_rotary
                      attribute: event_type
                      state: clock_wise
                    - condition: state
                      entity_id: binary_sensor.kitchen_light
                      state: "off"
                  sequence:
                    - action: light.turn_on
                      data:
                        brightness_pct: "{{ (state_attr('event.kitchen_switch_rotary', 'steps')|float / 3.60)|round(0) }}"
                      target:
                        entity_id: light.kitchen_lights
                - conditions:
                    - condition: state
                      entity_id: event.kitchen_switch_rotary
                      attribute: event_type
                      state: clock_wise
                  sequence:
                    - action: light.turn_on
                      data:
                        brightness_step_pct: "{{ (state_attr('event.kitchen_switch_rotary', 'steps')|float / 3.60)|round(0) }}"
                      target:
                        entity_id: "{{ state_attr('light.kitchen_lights', 'entity_id') |  expand() | selectattr('state', 'eq', 'on') |  map(attribute='entity_id') | list }}"
              default:
                - action: light.turn_on
                  data:
                    brightness_step_pct: "{{ (state_attr('event.kitchen_switch_rotary', 'steps')|float / -3.60)|round(0) }}"
                  target:
                    entity_id: "{{ state_attr('light.kitchen_lights', 'entity_id') | expand() | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"

        - conditions:
            - condition: trigger
              id: lights_on
            - condition: state
              entity_id: binary_sensor.home_someone
              state: "off"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_light_mode
              data:
                option: "off"

        - conditions:
            - condition: trigger
              id:
                - button_long
                - no_one_home
                - living_room_light_off
                - sleeping
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_light_mode
              data:
                option: "off"

        - conditions:
            - condition: trigger
              id: button_1_short
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_light_mode
              data:
                option: normal

        - conditions:
            - condition: trigger
              id: button_2_short
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_light_mode
              data:
                option: low

        - conditions:
            - condition: trigger
              id: button_3_short
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_light_mode
              data:
                option: high

        - conditions:
            - condition: trigger
              id: button_4_short
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.kitchen_light_mode
              data:
                option: full

    - if:
        - condition: trigger
          id:
            - button_1_short
            - button_2_short
            - button_3_short
            - button_4_short
        - condition: template
          value_template: |-
            {{ current_mode == states('input_select.kitchen_light_mode') }}
      then:
        - variables:
            force: true

    - parallel:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: custom
              sequence: []

            - conditions:
                - condition: state
                  entity_id: input_select.living_room_robot_vacuum_current_cleaning
                  state: kitchen_cleaning
                - condition: state
                  entity_id: binary_sensor.home_someone
                  state: "on"
                - condition: state
                  entity_id: binary_sensor.home_sleeping_everyone
                  state: "off"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    xy_color: [0.17, 0.70]
                    brightness_pct: 100
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "on"
                - condition: numeric_state
                  entity_id: sensor.home_outside_illuminance
                  below: 1
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.patio_door_long_open
                      state: "on"
                    - condition: state
                      entity_id: binary_sensor.kitchen_window
                      state: "on"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2500
                    brightness_pct: 30
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "on"
                - condition: numeric_state
                  entity_id: sensor.home_outside_illuminance
                  above: 1
                  below: 100
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.patio_door_long_open
                      state: "on"
                    - condition: state
                      entity_id: binary_sensor.kitchen_window
                      state: "on"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 1800
                    brightness_pct: 15
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "off"
                - condition: numeric_state
                  entity_id: sensor.home_outside_illuminance
                  below: 100
                - condition: state
                  entity_id: binary_sensor.living_room_light
                  state: "on"
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.patio_door_long_open
                      state: "on"
                    - condition: state
                      entity_id: binary_sensor.kitchen_window
                      state: "on"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_off
                  data:
                    transition: 1
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state:
                    - "off"
                    - normal
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "on"
                - condition: state
                  entity_id: select.bedroom_state
                  state:
                    - sleeping
                    - quiet_time
                    - wake_up_soon
                - condition: state
                  entity_id: binary_sensor.living_room_light
                  state: "off"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2300
                    brightness_pct: 10
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state:
                    - "off"
                    - normal
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "on"
                - condition: numeric_state
                  entity_id: sensor.home_outside_illuminance
                  below: 10000
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2700
                    brightness_pct: 80
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state:
                    - "off"
                    - normal
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "on"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_off
                  data:
                    transition: 1
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state:
                    - "off"
                    - normal
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "off"
                - condition: numeric_state
                  entity_id: sensor.home_outside_illuminance
                  below: 1000
                - condition: state
                  entity_id: binary_sensor.living_room_light
                  state: "on"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2300
                    brightness_pct: 50
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state:
                    - "off"
                    - normal
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "off"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_off
                  data:
                    transition: 1
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: "off"
              sequence:
                - action: light.turn_off
                  data:
                    transition: 1
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: normal
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2700
                    brightness_pct: 80
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: low
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2300
                    brightness_pct: 50
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: high
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2700
                    brightness_pct: 80
                  target:
                    entity_id: light.kitchen_light_strip_countertop

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: full
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 3000
                    brightness_pct: 100
                  target:
                    entity_id: light.kitchen_light_strip_countertop

        - choose:
            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: custom
              sequence: []

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state:
                    - "off"
                    - normal
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "on"
                - condition: state
                  entity_id: select.bedroom_state
                  state:
                    - sleeping
                    - quiet_time
                    - wake_up_soon
                - condition: state
                  entity_id: binary_sensor.living_room_light
                  state: "off"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_off
                  data:
                    transition: 1
                  target:
                    entity_id:
                      - light.kitchen_light_pendant_island_left
                      - light.kitchen_light_pendant_island_right
                      - light.kitchen_light_pendant_sink_left
                      - light.kitchen_light_pendant_sink_right

            - conditions:
                - condition: numeric_state
                  entity_id: sensor.home_outside_illuminance
                  below: 100
                - condition: state
                  entity_id: binary_sensor.living_room_light
                  state: "on"
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.patio_door_long_open
                      state: "on"
                    - condition: state
                      entity_id: binary_sensor.kitchen_window
                      state: "on"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_off
                  data:
                    transition: 1
                  target:
                    entity_id:
                      - light.kitchen_light_pendant_island_left
                      - light.kitchen_light_pendant_island_right
                      - light.kitchen_light_pendant_sink_left
                      - light.kitchen_light_pendant_sink_right
            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state:
                    - "off"
                    - normal
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "on"
                - condition: numeric_state
                  entity_id: sensor.home_outside_illuminance
                  below: 8000
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2700
                    brightness_pct: 80
                  target:
                    entity_id:
                      - light.kitchen_light_pendant_island_left
                      - light.kitchen_light_pendant_island_right
                      - light.kitchen_light_pendant_sink_left
                      - light.kitchen_light_pendant_sink_right
            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state:
                    - "off"
                    - normal
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "on"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_off
                  data:
                    transition: 1
                  target:
                    entity_id:
                      - light.kitchen_light_pendant_island_left
                      - light.kitchen_light_pendant_island_right
                      - light.kitchen_light_pendant_sink_left
                      - light.kitchen_light_pendant_sink_right

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state:
                    - "off"
                    - normal
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "off"
                - condition: numeric_state
                  entity_id: sensor.home_outside_illuminance
                  below: 100
                - condition: state
                  entity_id: binary_sensor.living_room_light
                  state: "on"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2300
                    brightness_pct: 15
                  target:
                    entity_id:
                      - light.kitchen_light_pendant_island_left
                      - light.kitchen_light_pendant_island_right
                      - light.kitchen_light_pendant_sink_left
                      - light.kitchen_light_pendant_sink_right

            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state:
                    - "off"
                    - normal
                - condition: state
                  entity_id: binary_sensor.kitchen_presence
                  state: "off"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_off
                  data:
                    transition: 1
                  target:
                    entity_id:
                      - light.kitchen_light_pendant_island_left
                      - light.kitchen_light_pendant_island_right
                      - light.kitchen_light_pendant_sink_left
                      - light.kitchen_light_pendant_sink_right
            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: "off"
              sequence:
                - action: light.turn_off
                  data:
                    transition: 1
                  target:
                    entity_id:
                      - light.kitchen_light_pendant_island_left
                      - light.kitchen_light_pendant_island_right
                      - light.kitchen_light_pendant_sink_left
                      - light.kitchen_light_pendant_sink_right
            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: normal
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2700
                    brightness_pct: 80
                  target:
                    entity_id:
                      - light.kitchen_light_pendant_island_left
                      - light.kitchen_light_pendant_island_right
                      - light.kitchen_light_pendant_sink_left
                      - light.kitchen_light_pendant_sink_right
            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: low
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2300
                    brightness_pct: 15
                  target:
                    entity_id:
                      - light.kitchen_light_pendant_island_left
                      - light.kitchen_light_pendant_island_right
                      - light.kitchen_light_pendant_sink_left
                      - light.kitchen_light_pendant_sink_right
            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: high
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2700
                    brightness_pct: 80
                  target:
                    entity_id:
                      - light.kitchen_light_pendant_island_left
                      - light.kitchen_light_pendant_island_right
                      - light.kitchen_light_pendant_sink_left
                      - light.kitchen_light_pendant_sink_right
            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: full
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 3000
                    brightness_pct: 100
                  target:
                    entity_id:
                      - light.kitchen_light_pendant_island_left
                      - light.kitchen_light_pendant_island_right
                      - light.kitchen_light_pendant_sink_left
                      - light.kitchen_light_pendant_sink_right

        - choose:
            - conditions:
                - condition: numeric_state
                  entity_id: sensor.home_outside_illuminance
                  below: 100
                - condition: or
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.patio_door_long_open
                      state: "on"
                    - condition: state
                      entity_id: binary_sensor.kitchen_window
                      state: "on"
                - condition: template
                  value_template: "{{ force == false }}"
              sequence:
                - action: light.turn_off
                  data:
                    transition: 1
                  target:
                    entity_id:
                      - light.kitchen_light_spot_island
                      - light.kitchen_light_spot_cooktop
                      - light.kitchen_light_spot_oven
                      - light.kitchen_light_spot_sink
                      - light.kitchen_light_spot_fridge
                      - light.kitchen_light_spot_hallway
            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: "high"
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 2700
                    brightness_pct: 50
                  target:
                    entity_id:
                      - light.kitchen_light_spot_island
                      - light.kitchen_light_spot_cooktop
                      - light.kitchen_light_spot_oven
                      - light.kitchen_light_spot_sink
                      - light.kitchen_light_spot_fridge
                      - light.kitchen_light_spot_hallway
            - conditions:
                - condition: state
                  entity_id: input_select.kitchen_light_mode
                  state: "full"
              sequence:
                - action: light.turn_on
                  data:
                    transition: 1
                    color_temp_kelvin: 3000
                    brightness_pct: 100
                  target:
                    entity_id:
                      - light.kitchen_light_spot_island
                      - light.kitchen_light_spot_cooktop
                      - light.kitchen_light_spot_oven
                      - light.kitchen_light_spot_sink
                      - light.kitchen_light_spot_fridge
                      - light.kitchen_light_spot_hallway
          default:
            - action: light.turn_off
              data:
                transition: 1
              target:
                entity_id:
                  - light.kitchen_light_spot_island
                  - light.kitchen_light_spot_cooktop
                  - light.kitchen_light_spot_oven
                  - light.kitchen_light_spot_sink
                  - light.kitchen_light_spot_fridge
                  - light.kitchen_light_spot_hallway
