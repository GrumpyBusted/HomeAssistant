- id: garage_light_north
  alias: Garage lys nord
  description: |
    Styrer havebelysningen nord for garagen.
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.house_presence_west
      from: "off"
      to: "on"
      id: detected_west

    - trigger: state
      entity_id: binary_sensor.house_presence_west
      from: "on"
      to: "off"
      id: cleared_west

    - trigger: state
      entity_id: binary_sensor.garage_presence_north
      from: "off"
      to: "on"
      id: detected_north

    - trigger: state
      entity_id: binary_sensor.garage_presence_north
      from: "on"
      to: "off"
      id: cleared_north

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - detected_west
                - detected_north
            - condition: state
              entity_id: binary_sensor.home_outside_light
              state: "off"
          sequence:
            - action: light.turn_on
              data:
                brightness_pct: 100
                color_temp_kelvin: 2700
                transition: 1
              target:
                entity_id: light.garage_light_north

        - conditions:
            - condition: trigger
              id:
                - cleared_west
                - cleared_north
            - condition: state
              entity_id: binary_sensor.house_presence_west
              state: "off"
            - condition: state
              entity_id: binary_sensor.garage_presence_north
              state: "off"
          sequence:
            - action: light.turn_off
              data:
                transition: 1
              target:
                entity_id: light.garage_light_north
