- id: hallway_photo_frame
  alias: Gang fotorammer
  description: |
    Styrer fotorammerne i gangen.
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.home_someone

    - trigger: state
      entity_id: select.bedroom_state

    - trigger: state
      entity_id: binary_sensor.bedroom_door

    - trigger: state
      entity_id:
        - media_player.hallway_photo_frame_joakim
        - media_player.hallway_photo_frame_emil
        - media_player.hallway_photo_frame_charlie
      from: unavailable
      id: Available

    - trigger: homeassistant
      event: start
      id: started

  conditions: []

  actions:
    - if:
        - condition: trigger
          id: started
      then:
        - action: androidtv.adb_command
          data:
            command: echo test
          target:
            entity_id:
              - media_player.hallway_photo_frame_joakim
              - media_player.hallway_photo_frame_emil
              - media_player.hallway_photo_frame_charlie
        - delay:
            seconds: 30

    - action: homeassistant.update_entity
      target:
        entity_id:
          - media_player.hallway_photo_frame_joakim
          - media_player.hallway_photo_frame_emil
          - media_player.hallway_photo_frame_charlie
    - delay:
        seconds: 3

    - choose:
        - conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: binary_sensor.home_someone
                  state: "off"
                - condition: and
                  conditions:
                    - condition: state
                      entity_id: select.bedroom_state
                      state:
                        - sleeping
                        - quiet_time
                        - wake_up_soon
                    - condition: state
                      entity_id: binary_sensor.bedroom_door
                      state: "on"
                - condition: and
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.emil_sleeping
                      state: "on"
                    - condition: state
                      entity_id: binary_sensor.emils_room_door
                      state: "on"
                - condition: and
                  conditions:
                    - condition: state
                      entity_id: binary_sensor.charlie_sleeping
                      state: "on"
                    - condition: state
                      entity_id: binary_sensor.emil_home
                      state: "off"
                    - condition: state
                      entity_id: binary_sensor.home_parent
                      state: "off"
          sequence:
            - action: media_player.turn_off
              target:
                entity_id:
                  - media_player.hallway_photo_frame_charlie
                  - media_player.hallway_photo_frame_emil
                  - media_player.hallway_photo_frame_joakim
      default:
        - action: media_player.turn_on
          target:
            entity_id:
              - media_player.hallway_photo_frame_charlie
              - media_player.hallway_photo_frame_emil
              - media_player.hallway_photo_frame_joakim

    - delay:
        seconds: 3

    - action: homeassistant.update_entity
      target:
        entity_id:
          - media_player.hallway_photo_frame_joakim
          - media_player.hallway_photo_frame_emil
          - media_player.hallway_photo_frame_charlie
