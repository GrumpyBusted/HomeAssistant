- id: house_decoration
  alias: Hus lys dekorationer
  description: |
    Styrer dekorationsbelysningen på huset efter tidspunkt og sæson.
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.home_light_ambience

  conditions: []

  actions:
    - variables:
        date: "{{ now().strftime('%m-%d') }}"

    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.home_light_ambience_evening
              state: "on"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ '10-15' <= date <= '10-31' }}"
                  sequence:
                    - action: script.light_turn_on_effect
                      data:
                        entity_id:
                          - light.house_decoration
                        entity_id_mode:
                          - select.house_decoration_1_mode
                          - select.house_decoration_2_mode
                          - select.house_decoration_3_mode
                          - select.house_decoration_4_mode
                          - select.house_decoration_5_mode
                        effect: Stripes
                - conditions:
                    - condition: template
                      value_template: "{{ '12-01' <= date <= '12-26' }}"
                  sequence:
                    - action: script.light_turn_on_effect
                      data:
                        entity_id:
                          - light.house_decoration
                        entity_id_mode:
                          - select.house_decoration_1_mode
                          - select.house_decoration_2_mode
                          - select.house_decoration_3_mode
                          - select.house_decoration_4_mode
                          - select.house_decoration_5_mode
                        effect: Sparkle
                - conditions:
                    - condition: template
                      value_template: "{{ date >= '12-30' or date == '01-01' }}"
                  sequence:
                    - action: script.light_turn_on_effect
                      data:
                        entity_id:
                          - light.house_decoration
                        entity_id_mode:
                          - select.house_decoration_1_mode
                          - select.house_decoration_2_mode
                          - select.house_decoration_3_mode
                          - select.house_decoration_4_mode
                          - select.house_decoration_5_mode
                        effect: Rainbow
        - conditions:
            - condition: state
              entity_id: binary_sensor.home_light_ambience_morning
              state: "on"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ '12-01' <= date <= '12-26' }}"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: light.house_decoration
                      data:
                        brightness_pct: 70
                        rgb_color: [0, 180, 30]
      default:
        - action: light.turn_off
          target:
            entity_id: light.house_decoration
