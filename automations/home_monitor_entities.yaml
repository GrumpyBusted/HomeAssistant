- id: home_monitor_entities
  alias: Hjem overvåg enheder
  description: |
    Overvåger entiteter og kontrollerer, om de er tilgængelige.
  mode: single
  trace:
    stored_traces: 50

  triggers:
    - trigger: homeassistant
      event: start
      id: started

    - trigger: state
      entity_id: timer.home_monitor_entities_timer
      from: active
      to: idle

    - trigger: time
      at: 04:01:00
      id: daily_check

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: started
          sequence:
            - action: timer.start
              target:
                entity_id: timer.home_monitor_entities_timer
              data:
                duration:
                  minutes: 10
      default:
        - action: timer.cancel
          target:
            entity_id: timer.home_monitor_entities_timer
        - variables:
            exclude_entities:
              - light.living_room_smart_plug_elf_house
              - light.charlies_room_light_bed_lamp
              - light.charlies_room_light_dresser
            ignore_unknown_patterns:
              - ".*_private_ble_device_.*"
              - ".*_lqi$"
              - '^button\..*'
              - '^image\.entrance_doorbell_event_image$'
              - '^number\..*_transition_time$'
              - '^person\.mosquitto$'
              - '^remote\..*_photo_frame_.*'
              - '^scene\.driveway_light_.*'
              - '^select\..*_group_scene$'
              - '^sensor\.living_room_printer_.*'
              - '^stt\.home_assistant_cloud$'
              - '^tts\.google_translate_en_com$'
              - '^update\..*'

            entities: |-
              {% set unavailable = states
                | rejectattr('domain', 'in', ['button', 'event', 'update'])
                | selectattr('state', 'eq', 'unavailable')
                | map(attribute='entity_id')
                | list
              %}

              {% set unknown = states
                | selectattr('state', 'eq', 'unknown')
                | rejectattr(
                    'entity_id',
                    'search',
                    ignore_unknown_patterns | join('|')
                  )
                | map(attribute='entity_id')
                | list
              %}              

              {% if trigger.id == 'daily_check' %}
                {% set lqi_unknown = states
                  | selectattr('domain', 'eq', 'sensor')
                  | selectattr('state', 'eq', 'unknown')
                  | selectattr('entity_id', 'search', '_lqi$')
                  | map(attribute='entity_id')
                  | list
                %}
                {% set unknown = unknown + lqi_unknown %}
              {% endif %}

              {% set entities = (unavailable + unknown)
                | reject('in', exclude_entities)
                | unique
                | list
              %}
              {{ entities | to_json }}
            devices: |-
              {% set ns = namespace(result={}) %}
              {% for e in entities | trim | from_json %}
                {% set dev_id = device_id(e) if device_id(e) else '[NO_DEVICE]' %}

                {% if dev_id not in ns.result %}
                  {% if dev_id == '[NO_DEVICE]' %}
                    {% set dev_name = '[NO_DEVICE]' %}
                    {% set dev_area_name = '' %}
                  {% else %}
                    {% set dev_name =
                      device_attr(dev_id, 'name_by_user')
                      if device_attr(dev_id, 'name_by_user')
                      else device_attr(dev_id, 'name')
                    %}
                    {% set dev_area_name = area_name(device_attr(dev_id, 'area_id')) %}
                  {% endif %}

                  {% set ns.result = dict(
                    ns.result,
                    **{
                      dev_id: {
                        "device_id": dev_id,
                        "name": dev_name,
                        "area": dev_area_name,
                        "entities": []
                      }
                    }
                  ) %}
                {% endif %}

                {% set ent_obj = {
                  "entity_id": e,
                  "friendly_name": state_attr(e, 'friendly_name') or e,
                  "state": states(e),
                  "last_changed": states[e].last_changed.isoformat()
                } %}

                {% set ns.result = dict(
                  ns.result,
                  **{
                    dev_id: dict(
                      ns.result[dev_id],
                      **{
                        "entities": ns.result[dev_id]["entities"] + [ent_obj]
                      }
                    )
                  }
                ) %}
              {% endfor %}
              {{ ns.result.values() | list | to_json }}

        - repeat:
            for_each: "{{ devices | trim | from_json }}"
            sequence:
              - action: script.push_notification
                data:
                  type: info
                  recipient: none
                  persistent: true
                  id: "home_assistant_monitor_unavailable_entities_{{ repeat.item.device_id }}"
                  title: |-
                    {{ repeat.item.name }}: {{ repeat.item.entities | length }} entities kræver opmærksomhed
                  message: |-
                    Device: {{ repeat.item.name }}
                    Område: {{ repeat.item.area }}

                    {% for ent in repeat.item.entities %}
                    - {{ ent.friendly_name }}
                      Entity: {{ ent.entity_id }}
                      State: {{ ent.state }}
                      Last changed: {{ ent.last_changed }}
                    {% endfor %}
