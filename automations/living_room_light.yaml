              above: 50
            - condition: numeric_state
              entity_id: cover.living_room_skylight_cover_south
              attribute: current_position
              above: 50
            - condition: template
              value_template: "{{ force == false }}"
          sequence:
            - action: light.turn_off
              data:
                transition: 1
              target:
                entity_id:
                  - light.living_room_light_strip_skylight

        - conditions:
            - condition: numeric_state
              entity_id: sensor.home_outside_illuminance
              above: 1
              below: 100
            - condition: or
              conditions:
                - condition: state
                  entity_id: binary_sensor.patio_door_long_open
                  state: "on"
                - condition: state
                  entity_id: binary_sensor.living_room_window
                  state: "on"
            - condition: template
              value_template: "{{ force == false }}"
          sequence:
            - action: light.turn_on
              data:
                transition: 1
                color_temp_kelvin: 1800
                brightness_pct: 15
              target:
                entity_id:
                  - light.living_room_light_strip_skylight

        - conditions:
