- id: "1735603602121"
  alias: Stue lys
  description: |
    Automatik til at styre lys i stuen
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: event.living_room_switch_button_1
      attribute: event_type
      to: short_release
      id: button_1_short

    - trigger: state
      entity_id: event.living_room_switch_button_2
      attribute: event_type
      to: short_release
      id: button_2_short

    - trigger: state
      entity_id: event.living_room_switch_button_3
      attribute: event_type
      to: short_release
      id: button_3_short

    - trigger: state
      entity_id: event.living_room_switch_button_4
      attribute: event_type
      to: short_release
      id: button_4_short

    - trigger: state
      entity_id:
        - event.living_room_switch_button_1
        - event.living_room_switch_button_2
        - event.living_room_switch_button_3
        - event.living_room_switch_button_4
      attribute: event_type
      to: long_release
      id: button_long

    - trigger: state
      entity_id: event.living_room_switch_rotary
      id: rotary

    - trigger: state
      entity_id: binary_sensor.everyone_sleeping
      from: "off"
      to: "on"
      id: sleeping

    - trigger: state
      entity_id: binary_sensor.everyone_sleeping
      to: "off"

    - trigger: state
      entity_id: binary_sensor.someone_home
      from: "on"
      to: "off"
      id: no_one_home

    - trigger: state
      entity_id: binary_sensor.someone_home
      to: "on"

    - trigger: state
      entity_id: binary_sensor.patio_door_long_open

    - trigger: state
      entity_id: binary_sensor.living_room_window

    - trigger: state
      entity_id: input_select.living_room_robot_vacuum_current_cleaning
      to: living_room_cleaning

    - trigger: state
      entity_id: input_select.living_room_robot_vacuum_current_cleaning
      from: living_room_cleaning

    - trigger: numeric_state
      entity_id:
        - cover.living_room_skylight_cover_north
        - cover.living_room_skylight_cover_south
      attribute: current_position
      above: 50

    - trigger: numeric_state
      entity_id:
        - cover.living_room_skylight_cover_north
        - cover.living_room_skylight_cover_south
      attribute: current_position
      below: 50

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      above: 10000
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      below: 10000
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      above: 1000
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      below: 1000
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      above: 100
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      below: 100
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      above: 1
      for: "00:03:00"

    - trigger: numeric_state
      entity_id: sensor.home_outside_illuminance
      below: 1
      for: "00:03:00"

    - trigger: state
      entity_id: binary_sensor.living_room_light
      from: "off"
      to: "on"
      for: 00:15:00
      id: lights_on

  conditions: []

  actions:
    - variables:
        current_mode: "{{ states('input_select.living_room_light_mode') }}"
        force: false

    - choose:
        - conditions:
            - condition: trigger
              id: rotary
            - condition: state
              entity_id: event.living_room_switch_rotary
              attribute: event_type
              state: clock_wise
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.living_room_light_mode
              data:
                option: custom
            - action: script.living_room_light_rotary
              data:
                step: "{{ (state_attr('event.living_room_switch_rotary', 'steps')|float / 3.60)|round(0) }}"

        - conditions:
            - condition: trigger
              id: rotary
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.living_room_light_mode
              data:
                option: custom
            - action: script.living_room_light_rotary
              data:
                step: "{{ (state_attr('event.living_room_switch_rotary', 'steps')|float / -3.60)|round(0) }}"

        - conditions:
            - condition: trigger
              id: lights_on
            - condition: state
              entity_id: binary_sensor.someone_home
              state: "off"
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.living_room_light_mode
              data:
                option: "off"

        - conditions:
            - condition: trigger
              id:
                - button_long
                - no_one_home
                - sleeping
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.living_room_light_mode
              data:
                option: "off"

        - conditions:
            - condition: trigger
              id: button_1_short
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.living_room_light_mode
              data:
                option: standard

        - conditions:
            - condition: trigger
              id: button_2_short
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.living_room_light_mode
              data:
                option: dining

        - conditions:
            - condition: trigger
              id: button_3_short
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.living_room_light_mode
              data:
                option: lounging

        - conditions:
            - condition: trigger
              id: button_4_short
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.living_room_light_mode
              data:
                option: all

    - if:
        - condition: trigger
          id:
            - button_1_short
            - button_2_short
            - button_3_short
            - button_4_short
        - condition: template
          value_template: |-
            {{ current_mode == states('input_select.living_room_light_mode') }}
      then:
        - variables:
            force: true

    - choose:
        - conditions:
            - condition: state
              entity_id: input_select.living_room_robot_vacuum_current_cleaning
              state: living_room_cleaning
            - condition: state
              entity_id: binary_sensor.someone_home
              state: "on"
            - condition: state
              entity_id: binary_sensor.everyone_sleeping
              state: "off"
            - condition: template
              value_template: "{{ force == false }}"
          sequence:
            - action: light.turn_on
              data:
                transition: 1
                xy_color: [0.17, 0.70]
                brightness_pct: 100
              target:
                entity_id:
                  - light.living_room_light_strip_skylight

        - conditions:
            - condition: state
              entity_id: input_select.living_room_light_mode
              state: custom
          sequence: []

        - conditions:
