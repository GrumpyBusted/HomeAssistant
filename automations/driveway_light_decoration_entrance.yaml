- id: driveway_light_decoration_entrance
  alias: Indkørsel lys dekorationer entre
  description: |
    Styrer dekorationsbelysningen ved indgangen efter tidspunkt og sæson.
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.home_light_ambience

  conditions: []

  actions:
    - variables:
        date: "{{ now().strftime('%m-%d') }}"

    - choose:
        - conditions:
            - condition: state
              entity_id: binary_sensor.home_light_ambience
              state: "on"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ '10-15' <= date <= '10-31' }}"
                  sequence:
                    - action: script.light_turn_on_effect
                      data:
                        entity_id: light.driveway_light_entrance_decoration
                        entity_id_mode: select.driveway_light_entrance_decoration_mode
                        effect: Stripes
                - conditions:
                    - condition: template
                      value_template: "{{ '12-01' <= date <= '12-26' }}"
                  sequence:
                    - action: script.light_turn_on_effect
                      data:
                        entity_id: light.driveway_light_entrance_decoration
                        entity_id_mode: select.driveway_light_entrance_decoration_mode
                        effect: Sparkle
                - conditions:
                    - condition: template
                      value_template: "{{ date >= '12-30' or date == '01-01' }}"
                  sequence:
                    - action: script.light_turn_on_effect
                      data:
                        entity_id: light.driveway_light_entrance_decoration
                        entity_id_mode: select.driveway_light_entrance_decoration_mode
                        effect: Rainbow
      default:
        - action: light.turn_off
          target:
            entity_id: light.driveway_light_entrance_decoration
