- id: 8151FA15-BEC6-4EED-B0A7-923B19F5F075
  alias: Bryggers todo sæbe
  description: |
    Opret todo opgaver vedrørende sæbe i bryggers
  mode: queued
  max: 10
  trace:
    stored_traces: 30

  triggers:
    - trigger: state
      entity_id: input_number.utility_room_motion_sensor_seconds
      id: changed

    - trigger: event
      event_type: todo_item_completed
      event_data:
        related: input_number.utility_room_soap_seconds_last_change
      id: completed

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: changed
          sequence:
            - action: script.create_todo_task
              data:
                subject: Fyld sæbe på dispenser i bryggers
                description: Hæld mere sæbe på sæbedispenser i bryggerset.
                related_entity_id: input_number.utility_room_soap_seconds_last_change
                entity_id: todo.todo_smart_todo
                is_active: "{{ states('input_number.utility_room_motion_sensor_seconds') | int(0) > states('input_number.utility_room_soap_seconds_last_change') | int(0) + 1000000 }}"

        - conditions:
            - condition: trigger
              id: completed
          sequence:
            - action: input_number.set_value
              target:
                entity_id: input_number.utility_room_soap_seconds_last_change
              data:
                value: "{{ states('input_number.utility_room_motion_sensor_seconds') | int(0) }}"
