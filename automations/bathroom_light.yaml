- id: bathroom_light
  alias: Badeværelse lys
  description: |
    Styrer belysningen på badeværelset.
  mode: queued
  max: 10
  trace:
    stored_traces: 20

  triggers:
    - trigger: state
      entity_id: binary_sensor.bathroom_presence
      from: "off"
      to: "on"
      id: detected

    - trigger: state
      entity_id: binary_sensor.bathroom_presence
      from: "on"
      to: "off"
      id: cleared

    - trigger: state
      entity_id: binary_sensor.home_someone
      from: "on"
      to: "off"
      id: no_one_home

  conditions: []

  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: detected
            - condition: state
              entity_id: binary_sensor.home_sleeping_everyone
              state: "on"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.bathroom_light
              data:
                brightness_pct: 100
                transition: 0

        - conditions:
            - condition: trigger
              id: detected
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.bathroom_light
              data:
                brightness_pct: 100
                transition: 0

        - conditions:
            - condition: trigger
              id: cleared
            - condition: state
              entity_id: light.bathroom_light
              state: "on"
          sequence:
            - action: light.turn_on
              data:
                flash: short
              target:
                entity_id: light.bathroom_light
            - delay: "00:00:03"
            - if:
                - condition: state
                  entity_id: binary_sensor.bathroom_presence
                  state: "off"
              then:
                - action: light.turn_off
                  target:
                    entity_id: light.bathroom_light
                  data:
                    transition: 0

        - conditions:
            - condition: trigger
              id: no_one_home
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.bathroom_light
              data:
                transition: 0
