- trigger:
    - platform: state
      entity_id: sensor.driveway_ev_charger_added_energy
  sensor:
    - name: Indkørsel billader total energi
      unique_id: driveway_ev_charger_total_energy
      icon: mdi:lightning-bolt
      device_class: energy
      state_class: total_increasing
      unit_of_measurement: kWh
      state: |-
        {% set current = states('sensor.driveway_ev_charger_added_energy') | float(none) %}
        {% set previous = this.attributes.get('previous_reading', 0) | float(0) %}
        {% set accumulated = this.attributes.get('accumulated', 0) | float(0) %}
        {% set total = this.state | float(0) %}
        {% if not is_number(current) %}
          {{ total }}
        {% elif current < previous %}
          {{ accumulated + previous + current }}
        {% else %}
          {{ accumulated + current }}
        {% endif %}
      attributes:
        previous_reading: |-
          {% set current = states('sensor.driveway_ev_charger_added_energy') | float(none) %}
          {% set previous = this.attributes.get('previous_reading', 0) | float(0) %}
          {% if is_number(current) %}
            {{ current }}
          {% else %}
            {{ previous }}
          {% endif %}
        accumulated: |-
          {% set current = states('sensor.driveway_ev_charger_added_energy') | float(none) %}
          {% set previous = this.attributes.get('previous_reading', 0) | float(0) %}
          {% set accumulated = this.attributes.get('accumulated', 0) | float(0) %}
          {% if is_number(current) and current < previous %}
            {{ accumulated + previous }}
          {% else %}
            {{ accumulated }}
          {% endif %}

