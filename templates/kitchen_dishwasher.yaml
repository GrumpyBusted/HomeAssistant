- triggers:
    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_notification_active
      to: "on"
    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_notification_active
      to: "off"
      for: "00:00:02"
  binary_sensor:
    - name: "Køkken opvaskemaskine notifikation aktiv (sikker)"
      unique_id: kitchen_dishwasher_notification_active_safe
      device_class: problem
      state: |-
        {% set value = states('binary_sensor.kitchen_dishwasher_notification_active') %}
        {% if value in ['unavailable', 'unknown'] or is_state('switch.kitchen_dishwasher_power', 'off') %}
          {{ this.state }}
        {% else %}
          {{ value }}
        {% endif %}

- triggers:
    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_problem
      to: "on"
    - trigger: state
      entity_id: binary_sensor.kitchen_dishwasher_problem
      to: "off"
      for: "00:00:02"
  binary_sensor:
    - name: "Køkken opvaskemaskine problem (sikker)"
      unique_id: kitchen_dishwasher_problem_safe
      device_class: problem
      state: |-
        {% set value = states('binary_sensor.kitchen_dishwasher_problem') %}
        {% if value in ['unavailable', 'unknown'] or is_state('switch.kitchen_dishwasher_power', 'off') %}
          {{ this.state }}
        {% else %}
          {{ value }}
        {% endif %}

- sensor:
    - name: "Køkken opvaskemaskine billigst starttidspunkt"
      unique_id: kitchen_dishwasher_cheapest_start_time
      device_class: timestamp
      icon: mdi:dishwasher
      state: |-
        {% set today = state_attr('sensor.energy_data_service', 'raw_today') or [] %}
        {% set tomorrow = state_attr('sensor.energy_data_service', 'raw_tomorrow') or [] %}
        {% set data = today + tomorrow %}

        {% if not data %}
          {{ none }}
        {% else %}
          {% set current = now() %}
          {% set today_21 = today_at('21:00') %}
          {% set today_09 = today_at('09:00') %}

          {% if current < today_09 %}
            {# Efter midnat og før kl. 9: nu til kl. 9 i dag #}
            {% set earliest = current %}
            {% set deadline = today_09 %}
          {% elif current < today_21 %}
            {# Kl. 9 til 21: kl. 21 i dag til kl. 9 i morgen #}
            {% set earliest = today_21 %}
            {% set deadline = today_09 + timedelta(days=1) %}
          {% else %}
            {# Fra kl. 21: nu til kl. 9 i morgen #}
            {% set earliest = current %}
            {% set deadline = today_09 + timedelta(days=1) %}
          {% endif %}

          {% set best = namespace(price=999999, start=none) %}

          {% for row in data | sort(attribute='hour') %}
            {% set start_time = row.hour %}
            {% set end_time = start_time + timedelta(hours=4) %}

            {% if start_time >= earliest and end_time <= deadline %}
              {% set segment = data
                | selectattr('hour', '>=', start_time)
                | selectattr('hour', '<', end_time)
                | list %}

              {% if segment | length > 0 %}
                {% set avg = (segment | map(attribute='price') | sum) / 4 %}
                {% if avg < best.price %}
                  {% set best.price = avg %}
                  {% set best.start = start_time %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}

          {{ best.start if best.start is not none else none }}
        {% endif %}
