- sensor:
    - name: "Hjem elforbrug denne måned"
      unique_id: home_energy_current_month
      icon: mdi:calendar-month
      state: "{{ states('sensor.home_energy_total_monthly') | float(0) }}"
      attributes:
        car: "{{ states('sensor.home_energy_car_monthly') | float(0) }}"
        greenhouse: "{{ states('sensor.home_energy_greenhouse_monthly') | float(0) }}"
        laundry: "{{ states('sensor.home_energy_laundry_monthly') | float(0) }}"
        climate: "{{ states('sensor.home_energy_climate_monthly') | float(0) }}"
        heating: "{{ states('sensor.home_energy_heating_monthly') | float(0) }}"
        other: "{{ states('sensor.home_energy_other_monthly') | float(0) }}"

- sensor:
    - name: "Hjem elforbrug sidste måned"
      unique_id: home_energy_previous_month
      icon: mdi:calendar-month
      state: "{{ state_attr('sensor.home_energy_total_monthly', 'last_period') | float(0) }}"
      attributes:
        car: "{{ state_attr('sensor.home_energy_car_monthly', 'last_period') | float(0) }}"
        greenhouse: "{{ state_attr('sensor.home_energy_greenhouse_monthly', 'last_period') | float(0) }}"
        laundry: "{{ state_attr('sensor.home_energy_laundry_monthly', 'last_period') | float(0) }}"
        climate: "{{ state_attr('sensor.home_energy_climate_monthly', 'last_period') | float(0) }}"
        heating: "{{ state_attr('sensor.home_energy_heating_monthly', 'last_period') | float(0) }}"
        other: "{{ state_attr('sensor.home_energy_other_monthly', 'last_period') | float(0) }}"

