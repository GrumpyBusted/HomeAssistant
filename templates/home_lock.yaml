- triggers:
    - trigger: state
      entity_id:
        - lock.entrance_lock_cloud
        - lock.entrance_lock_bluetooth
      from: locked
      to: unlocked
      id: unlocked
    - trigger: state
      entity_id:
        - lock.entrance_lock_cloud
        - lock.entrance_lock_bluetooth
      from: unlocked
      to: locked
      id: locked
    - trigger: state
      entity_id:
        - lock.entrance_lock_cloud
        - lock.entrance_lock_bluetooth
      to:
        - locking
        - unlocking
        - jammed
    - trigger: homeassistant
      event: start
      id: startup
  lock:
    - name: Entre lås
      unique_id: entrance_lock
      icon: mdi:lock
      code_format: '^\d{6}$'
      state: |-
        {% set cloud = states('lock.entrance_lock_cloud') %}
        {% set bt = states('lock.entrance_lock_bluetooth') %}
        {% if trigger.id == 'unlocked' %}
          unlocked
        {% elif trigger.id == 'locked' %}
          locked
        {% elif cloud == bt and cloud in ['locked', 'unlocked'] %}
          {{ cloud }}
        {% elif trigger.id == 'startup' %}
          {% if cloud in ['locked', 'unlocked'] %}
            {{ cloud }}
          {% elif bt in ['locked', 'unlocked'] %}
            {{ bt }}
          {% else %}
            unknown
          {% endif %}
        {% else %}
          {{ this.state if this.state in ['locked', 'unlocked'] else 'unknown' }}
        {% endif %}
      availability: |-
        {{
          states('lock.entrance_lock_cloud') in ['locked', 'unlocked'] or
          states('lock.entrance_lock_bluetooth') in ['locked', 'unlocked']
        }}
      lock:
        action: script.home_lock_door
        data:
          lock: lock.entrance_lock
          cloud_lock: lock.entrance_lock_cloud
          bluetooth_lock: lock.entrance_lock_bluetooth
          lock_ready: binary_sensor.entrance_lock_ready
          wake_button: button.entrance_lock_cloud_wake
      unlock:
        action: script.home_unlock_door
        data:
          lock: lock.entrance_lock
          cloud_lock: lock.entrance_lock_cloud
          bluetooth_lock: lock.entrance_lock_bluetooth
          wake_button: button.entrance_lock_cloud_wake
