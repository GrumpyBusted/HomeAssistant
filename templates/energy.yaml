- sensor:
    - name: energy_price_optimal_window_start
      unique_id: ADDA8D93-A8FC-4F02-9A0C-F6E9451A8CAA
      device_class: timestamp
      icon: "mdi:clock-outline"
      state: >-
        {% set data = state_attr('sensor.energy_data_service', 'raw_today') %} {% if not data %}
          {{ none }}
        {% else %}
          {# --- Configuration --- #}
          {% set window_minutes = 150 %}   {# 2.5 hour window #}
          {% set search_hours = 10 %}      {# Look 10 hours ahead #}
        
          {# --- Current time rounded to nearest 15 minutes (local time) --- #}
          {% set now_local = now().replace(minute=(now().minute // 15) * 15, second=0, microsecond=0) %}
          {% set end_local = now_local + timedelta(hours=search_hours) %}
        
          {# --- Filter for times between now and search horizon --- #}
          {% set rows = data | map(attribute='hour') | select('>=', now_local) | select('<=', end_local) | list %}
        
          {% if rows | length == 0 %}
            {{ none }}
          {% else %}
            {# --- Sort one time (CPU efficient) --- #}
            {% set rows = rows | sort %}
        
            {# --- Track best (cheapest) window --- #}
            {% set best = namespace(price=999999, start=now_local) %}
        
            {# --- Main loop: test each possible start time --- #}
            {% for row in rows  %}
              {% set start_time = row %}
              {% set end_time = start_time + timedelta(minutes=window_minutes) %}
        
              {# Build segment: prices from start_time to end_time #}
              {% set segment = data | selectattr('hour', '>=', start_time) | selectattr('hour', '<=', end_time) | list %}
        
              {% if segment | length > 0 %}
                {% set avg = (segment | map(attribute='price') | sum) / (segment | length) %}
                {% if avg < best.price %}
                  {% set best.price = avg %}
                  {% set best.start = start_time %}
                {% endif %}
              {% endif %}
            {% endfor %}
        
            {# Return final timestamp in correct local format #}
            {{ best.start }}
          {% endif %}
        {% endif %}


      attributes:
        time_until_start: >-
          {# 
            Friendly time difference rounded to nearest 15 minutes.
            Format H:MM (no leading zero)
          #} 
          {% set ts = states('sensor.energy_price_optimal_window_start') %} 
          {% if ts in ['unknown', 'unavailable', none] %}
            {{ none }}
          {% else %}
            {% set start = ts | as_datetime %}
            {% set diff_seconds = (start - now()).total_seconds() %}
          
            {% if diff_seconds < 0 %}
              0:00
            {% else %}
              {# Convert to minutes #}
              {% set total_minutes = diff_seconds / 60 %}
          
              {# Round to nearest 15 minutes #}
              {% set rounded = ((total_minutes / 15) | round(0) * 15) | int %}
          
              {# Split #}
              {% set hours = rounded // 60 %}
              {% set minutes = rounded % 60 %}
          
              {{ "%d:%02d" | format(hours, minutes) }}
            {% endif %}
          {% endif %} 


        local_time: >-
          {% set ts = best.start if best is defined else states('sensor.energy_price_optimal_window_start') %} {% if ts in ['unknown', 'unavailable', none] %}
            {{ none }}
          {% else %}
            {{ as_datetime(ts) | as_local }}
          {% endif %}


- sensor:
    - name: energy_price_dishwasher_start
      unique_id: energy_price_dishwasher_start
      device_class: timestamp
      icon: mdi:dishwasher
      state: |-
        {% set today = state_attr('sensor.energy_data_service', 'raw_today') or [] %}
        {% set tomorrow = state_attr('sensor.energy_data_service', 'raw_tomorrow') or [] %}
        {% set data = today + tomorrow %}

        {% if not data %}
          {{ none }}
        {% else %}
          {% set current = now() %}
          {% set today_21 = today_at('21:00') %}
          {% set today_09 = today_at('09:00') %}

          {% if current < today_09 %}
            {# Efter midnat og før kl. 9: nu til kl. 9 i dag #}
            {% set earliest = current %}
            {% set deadline = today_09 %}
          {% elif current < today_21 %}
            {# Kl. 9 til 21: kl. 21 i dag til kl. 9 i morgen #}
            {% set earliest = today_21 %}
            {% set deadline = today_09 + timedelta(days=1) %}
          {% else %}
            {# Fra kl. 21: nu til kl. 9 i morgen #}
            {% set earliest = current %}
            {% set deadline = today_09 + timedelta(days=1) %}
          {% endif %}

          {% set best = namespace(price=999999, start=none) %}

          {% for row in data | sort(attribute='hour') %}
            {% set start_time = row.hour %}
            {% set end_time = start_time + timedelta(hours=4) %}

            {% if start_time >= earliest and end_time <= deadline %}
              {% set segment = data
                | selectattr('hour', '>=', start_time)
                | selectattr('hour', '<', end_time)
                | list %}

              {% if segment | length > 0 %}
                {% set avg = (segment | map(attribute='price') | sum) / 4 %}
                {% if avg < best.price %}
                  {% set best.price = avg %}
                  {% set best.start = start_time %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}

          {{ best.start if best.start is not none else none }}
        {% endif %}
